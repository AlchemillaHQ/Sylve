name: readmeabook
services:
  readmeabook:
    image: ghcr.io/daemonless/readmeabook:latest
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - "${CONFIG_PATH}:/app/config"
      - "${CACHE_PATH}:/app/cache"
      - "${DATA_PATH}:/var/lib/postgresql/data"
      - "${REDIS_PATH}:/var/lib/redis"
      - "${DOWNLOADS_PATH}:/downloads"
      - "${AUDIOBOOKS_PATH}:/audiobooks"
    ports:
      - "${WEB_PORT}:3030"
x-fjord:
  version: "0.1"
  info:
    id: readmeabook
    name: ReadMeABook
    description: Audiobook request and management platform with AI recommendations.
    category: Media Management
    class: service
    icon: icons/readmeabook.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/kikootwo/readmeabook
    web_url: https://github.com/kikootwo/readmeabook
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "3030"
    - name: CONFIG_PATH
      label: Application configuration and secrets
      type: path
      default: ""
    - name: CACHE_PATH
      label: Thumbnail and metadata cache
      type: path
      default: ""
    - name: DATA_PATH
      label: PostgreSQL database storage
      type: path
      default: ""
    - name: REDIS_PATH
      label: Redis data persistence
      type: path
      default: ""
    - name: DOWNLOADS_PATH
      label: Download client path
      type: path
      default: ""
    - name: AUDIOBOOKS_PATH
      label: Audiobook library
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: LOG_LEVEL
      label: 'Logging level (default: info)'
      type: string
      default: info
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        readmeabook:
          name: readmeabook
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:3030 proto:tcp'
            - template: !ENV '${PWD}/readmeabook.conf'
            - template: !ENV '${PWD}/template.conf'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - LOG_LEVEL: !ENV '${LOG_LEVEL}'
          volumes:
            - READMEABOOK_CONFIG_PATH: /app/config
            - READMEABOOK_CACHE_PATH: /app/cache
            - READMEABOOK_DATA_PATH: /var/lib/postgresql/data
            - READMEABOOK_REDIS_PATH: /var/lib/redis
            - DOWNLOADS_PATH: /downloads
            - READMEABOOK_AUDIOBOOKS_PATH: /audiobooks
      volumes:
        READMEABOOK_CONFIG_PATH:
          device: !ENV '${READMEABOOK_CONFIG_PATH}'
        READMEABOOK_CACHE_PATH:
          device: !ENV '${READMEABOOK_CACHE_PATH}'
        READMEABOOK_DATA_PATH:
          device: !ENV '${READMEABOOK_DATA_PATH}'
        READMEABOOK_REDIS_PATH:
          device: !ENV '${READMEABOOK_REDIS_PATH}'
        DOWNLOADS_PATH:
          device: !ENV '${DOWNLOADS_PATH}'
        READMEABOOK_AUDIOBOOKS_PATH:
          device: !ENV '${READMEABOOK_AUDIOBOOKS_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/readmeabook:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
      allow.sysvipc
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=readmeabook
      PUID=1000
      PGID=1000
      TZ=UTC
      LOG_LEVEL=info
      WEB_PORT=3030
      READMEABOOK_CONFIG_PATH=/readmeabook/config
      READMEABOOK_CACHE_PATH=/readmeabook/cache
      READMEABOOK_DATA_PATH=/readmeabook/data
      READMEABOOK_REDIS_PATH=/readmeabook/redis
      DOWNLOADS_PATH=downloads
      READMEABOOK_AUDIOBOOKS_PATH=/readmeabook/audiobooks
