x-fjord:
  version: "0.1"
  info:
    id: crafting-apps
    name: Crafting Apps
    description: ArtCraft's fifteen open-source, clean-room creative and office apps (PhotoCraft, VectorCraft, FilmCraft, LightCraft, PdfCraft, EffectCraft, DesignCraft, WordCraft, GridCraft, DeckCraft, FigCraft, SoundCraft, CADCraft, SolidCraft, Craft Anything) as WebAssembly web apps. Pick the ones you want.
    category: Photos & Media
    class: stack
    icon: icons/crafting-apps.svg
    web_port: "8080"
    upstream_url: https://github.com/storytold
    web_url: https://getartcraft.com/apps
  variables:
    - name: PUID
      label: User ID for the nginx worker processes
      type: string
      default: "1000"
      optional: true
    - name: PGID
      label: Group ID for the nginx worker processes
      type: string
      default: "1000"
      optional: true
    - name: TZ
      label: Timezone for the containers
      type: string
      default: UTC
      optional: true
  appjail:
    director: |
      # appjail-director.yml

      options:
      - virtualnet: :<random> default
      - nat:
      services:
        photocraft:
          name: photocraft
          options:
          - container: boot args:--pull=newer
          - expose: 8080:80 proto:tcp
          - from: ghcr.io/daemonless/photocraft:latest
          oci:
            user: root
            environment:
            - PUID: !ENV '${PUID}'
            - PGID: !ENV '${PGID}'
            - TZ: !ENV '${TZ}'
        vectorcraft:
          name: vectorcraft
          options:
          - container: boot args:--pull=newer
          - expose: 8081:80 proto:tcp
          - from: ghcr.io/daemonless/vectorcraft:latest
          oci:
            user: root
            environment:
            - PUID: !ENV '${PUID}'
            - PGID: !ENV '${PGID}'
            - TZ: !ENV '${TZ}'
        filmcraft:
          name: filmcraft
          options:
          - container: boot args:--pull=newer
          - expose: 8082:80 proto:tcp
          - from: ghcr.io/daemonless/filmcraft:latest
          oci:
            user: root
            environment:
            - PUID: !ENV '${PUID}'
            - PGID: !ENV '${PGID}'
            - TZ: !ENV '${TZ}'
        lightcraft:
          name: lightcraft
          options:
          - container: boot args:--pull=newer
          - expose: 8083:80 proto:tcp
          - from: ghcr.io/daemonless/lightcraft:latest
          oci:
            user: root
            environment:
            - PUID: !ENV '${PUID}'
            - PGID: !ENV '${PGID}'
            - TZ: !ENV '${TZ}'
        pdfcraft:
          name: pdfcraft
          options:
          - container: boot args:--pull=newer
          - expose: 8084:80 proto:tcp
          - from: ghcr.io/daemonless/pdfcraft:latest
          oci:
            user: root
            environment:
            - PUID: !ENV '${PUID}'
            - PGID: !ENV '${PGID}'
            - TZ: !ENV '${TZ}'
        effectcraft:
          name: effectcraft
          options:
          - container: boot args:--pull=newer
          - expose: 8085:80 proto:tcp
          - from: ghcr.io/daemonless/effectcraft:latest
          oci:
            user: root
            environment:
            - PUID: !ENV '${PUID}'
            - PGID: !ENV '${PGID}'
            - TZ: !ENV '${TZ}'
        designcraft:
          name: designcraft
          options:
          - container: boot args:--pull=newer
          - expose: 8086:80 proto:tcp
          - from: ghcr.io/daemonless/designcraft:latest
          oci:
            user: root
            environment:
            - PUID: !ENV '${PUID}'
            - PGID: !ENV '${PGID}'
            - TZ: !ENV '${TZ}'
        wordcraft:
