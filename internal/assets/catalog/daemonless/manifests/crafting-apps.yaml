name: crafting-apps
services:
  photocraft:
    container_name: photocraft
    image: ghcr.io/daemonless/photocraft:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    ports:
      - "8080:80"
    restart: always
