          - expose: 8094:80 proto:tcp
          - from: ghcr.io/daemonless/craft-anything:latest
          oci:
            user: root
            environment:
            - PUID: !ENV '${PUID}'
            - PGID: !ENV '${PGID}'
            - TZ: !ENV '${TZ}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/crafting-apps:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=crafting-apps
      PUID=1000
      PGID=1000
      TZ=Etc/UTC
  networking:
    '*': default
  choices:
    - id: photocraft
      kind: part
      label: PhotoCraft
      doc: Image editing with layers, masks, adjustment layers and PSD files (Photoshop).
      default: "on"
      options:
        - id: "on"
          label: Included
        - id: "off"
          label: Left out
          drop:
            - photocraft
    - id: vectorcraft
      kind: part
      label: VectorCraft
      doc: Vector illustration (Illustrator).
