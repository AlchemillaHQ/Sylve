name: babybuddy
services:
  babybuddy:
    image: ghcr.io/daemonless/babybuddy:latest
    container_name: babybuddy
    # "always", not "unless-stopped": FreeBSD's podman rc.d only auto-starts
    # containers with restart-policy=always at boot (needs podman_enable=YES).
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8000"
x-fjord:
  version: "0.1"
  info:
    id: babybuddy
    name: Baby Buddy
    description: Baby Buddy helps caregivers track sleep, feedings, diaper changes, tummy time and more, to learn about and predict baby's needs without (as much) guess work.
    category: Productivity
    class: service
    icon: icons/babybuddy.png
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/babybuddy/babybuddy
    web_url: https://docs.baby-buddy.net/
  variables:
    - name: WEB_PORT
      label: 'Web UI (first login admin / admin: change it right away)'
      type: port
      default: "8000"
    - name: CONFIG_DATA
      label: Database (db.sqlite3), uploads (media/) and the secret key
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        babybuddy:
          name: babybuddy
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8000 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - BABYBUDDY_CONFIG_PATH: /config
      volumes:
        BABYBUDDY_CONFIG_PATH:
          device: !ENV '${BABYBUDDY_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/babybuddy:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=babybuddy
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=8000
      BABYBUDDY_CONFIG_PATH=/babybuddy
