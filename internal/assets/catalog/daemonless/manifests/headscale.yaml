name: headscale
services:
  headscale:
    image: ghcr.io/daemonless/headscale:latest
    container_name: headscale
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8080"
      - "${PORT_3478_UDP}:3478/udp"
x-fjord:
  version: "0.1"
  info:
    id: headscale
    name: Headscale
    description: An open source, self-hosted implementation of the Tailscale control server.
    category: Network
    class: service
    icon: icons/headscale.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/juanfont/headscale
    web_url: https://headscale.net/
  variables:
    - name: WEB_PORT
      label: Control server (HTTP)
      type: port
      default: "8080"
    - name: PORT_3478_UDP
      label: Embedded DERP STUN (UDP)
      type: port
      default: "3478"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        headscale:
          name: headscale
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8080 proto:tcp'
            - expose: '3478:3478 proto:udp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - HEADSCALE_CONFIG_PATH: /config
      volumes:
        HEADSCALE_CONFIG_PATH:
          device: !ENV '${HEADSCALE_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/headscale:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=headscale
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=8080
      HEADSCALE_CONFIG_PATH=/headscale
