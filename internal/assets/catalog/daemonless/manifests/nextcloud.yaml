name: nextcloud
services:
  nextcloud:
    image: ghcr.io/daemonless/nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${DATA_PATH}:/data"
    ports:
      - "${WEB_PORT}:8082"
x-fjord:
  version: "0.1"
  info:
    id: nextcloud
    name: Nextcloud
    description: Online collaboration platform providing groupware capabilities by default, extensible with additional apps.
    category: Utilities
    class: service
    icon: icons/nextcloud.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/nextcloud/server
    web_url: https://nextcloud.com/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8082"
    - name: CONFIG_DATA
      label: Configuration and application files
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: DATA_PATH
      label: User data storage
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
      aliases:
        - latest
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        nextcloud:
          name: nextcloud
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8082 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - NEXTCLOUD_CONFIG_PATH: /config
            - NEXTCLOUD_DATA_PATH: /data
      volumes:
        NEXTCLOUD_CONFIG_PATH:
          device: !ENV '${NEXTCLOUD_CONFIG_PATH}'
        NEXTCLOUD_DATA_PATH:
          device: !ENV '${NEXTCLOUD_DATA_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/nextcloud:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=nextcloud
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=8082
      NEXTCLOUD_CONFIG_PATH=/nextcloud
      NEXTCLOUD_DATA_PATH=/nextcloud/data
