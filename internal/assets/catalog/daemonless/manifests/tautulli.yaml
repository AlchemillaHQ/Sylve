name: tautulli
services:
  tautulli:
    image: ghcr.io/daemonless/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - TAUTULLI_DOCKER=${TAUTULLI_DOCKER}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8181"
x-fjord:
  version: "0.1"
  info:
    id: tautulli
    name: Tautulli
    description: Monitoring and tracking tool for Plex Media Server — tracks what is being watched, who is watching, and when.
    category: Media Servers
    class: service
    icon: icons/tautulli.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/Tautulli/Tautulli
    web_url: https://tautulli.com/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8181"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: TAUTULLI_DOCKER
      label: Disable internal updater (True/False)
      type: string
      default: "True"
  variants:
    - id: latest
      label: Latest
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        tautulli:
          name: tautulli
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8181 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - TAUTULLI_DOCKER: !ENV '${TAUTULLI_DOCKER}'
          volumes:
            - TAUTULLI_CONFIG_PATH: /config
      volumes:
        TAUTULLI_CONFIG_PATH:
          device: !ENV '${TAUTULLI_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/tautulli:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=tautulli
      PUID=1000
      PGID=1000
      TZ=UTC
      TAUTULLI_DOCKER=True
      WEB_PORT=8181
      TAUTULLI_CONFIG_PATH=/tautulli
