name: opencloud
services:
  opencloud:
    image: ghcr.io/daemonless/opencloud:latest
    container_name: opencloud
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - OC_URL=${OC_URL}
    extra_hosts:
      - "hostname:127.0.0.1"
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:9200"
x-fjord:
  version: "0.1"
  info:
    id: opencloud
    name: OpenCloud
    description: OpenCloud is a modern file-sync and share platform.
    category: Utilities
    class: service
    icon: icons/opencloud.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/daemonless/opencloud
    web_url: https://opencloud.eu/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "9200"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: OC_URL
      label: URL where OpenCloud can be accessed
      type: string
      default: https://hostname:9200
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        opencloud:
          name: opencloud
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:9200 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - OC_URL: !ENV '${OC_URL}'
          volumes:
            - OPENCLOUD_CONFIG_PATH: /config
      volumes:
        OPENCLOUD_CONFIG_PATH:
          device: !ENV '${OPENCLOUD_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/opencloud:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=opencloud
      PUID=1000
      PGID=1000
      TZ=UTC
      OC_URL=https://hostname:9200
      WEB_PORT=9200
      OPENCLOUD_CONFIG_PATH=/opencloud
