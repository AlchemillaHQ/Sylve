name: grafana
services:
  grafana:
    image: ghcr.io/daemonless/grafana:pkg
    container_name: grafana
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - GF_DATABASE_TYPE=${GF_DATABASE_TYPE}
      - GF_DATABASE_HOST=${GF_DATABASE_HOST}
      - GF_DATABASE_USER=${GF_DATABASE_USER}
      - GF_DATABASE_PASSWORD=${GF_DATABASE_PASSWORD}
      - GF_DATABASE_NAME=${GF_DATABASE_NAME}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:3000"
x-fjord:
  version: "0.1"
  info:
    id: grafana
    name: Grafana
    description: Grafana is an open source and composable observability and data visualization platform. Visualize metrics, logs, and traces from multiple sources like Prometheus, Loki, Elasticsearch, InfluxDB, Postgres and many more.
    category: Network
    class: service
    icon: icons/grafana.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/grafana/grafana
    web_url: https://grafana.com/grafana/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "3000"
    - name: CONFIG_DATA
      label: Configuration, data, logs, plugins and provisioning
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: GF_DATABASE_TYPE
      label: sqlite3, postgres or mysql; set by the Database choice. Empty keeps grafana.ini
      type: string
      default: ""
      optional: true
    - name: GF_DATABASE_HOST
      label: Database host, optionally host:port (Database choice)
      type: string
      default: ""
      optional: true
    - name: GF_DATABASE_USER
      label: Database user (Database choice)
      type: string
      default: ""
      optional: true
    - name: GF_DATABASE_PASSWORD
      label: Database password (Database choice)
      type: secret
      default: ""
      optional: true
    - name: GF_DATABASE_NAME
      label: Database name (Database choice)
      type: string
      default: ""
      optional: true
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
      aliases:
        - latest
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        grafana:
          name: grafana
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:3000 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - GF_DATABASE_TYPE: !ENV '${GF_DATABASE_TYPE}'
              - GF_DATABASE_HOST: !ENV '${GF_DATABASE_HOST}'
              - GF_DATABASE_USER: !ENV '${GF_DATABASE_USER}'
              - GF_DATABASE_PASSWORD: !ENV '${GF_DATABASE_PASSWORD}'
              - GF_DATABASE_NAME: !ENV '${GF_DATABASE_NAME}'
          volumes:
            - GRAFANA_CONFIG_PATH: /config
      volumes:
        GRAFANA_CONFIG_PATH:
          device: !ENV '${GRAFANA_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/grafana:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=grafana
      PUID=1000
      PGID=1000
      TZ=UTC
      GF_DATABASE_TYPE=
      GF_DATABASE_HOST=
      GF_DATABASE_USER=
      GF_DATABASE_PASSWORD=<GF_DATABASE_PASSWORD>
      GF_DATABASE_NAME=
      WEB_PORT=3000
      GRAFANA_CONFIG_PATH=/grafana
  networking:
    '*': private
    grafana: default
  choices:
    - id: database
      kind: database
      label: Database
      doc: Where the app keeps its data. The default needs nothing else running.
      default: sqlite
      options:
        - id: sqlite
          label: SQLite
          doc: A file in the app's config folder. Right for one person, nothing extra to run.
          env:
            GF_DATABASE_TYPE: sqlite3
        - id: postgres
          label: PostgreSQL
          doc: One more container, its data in its own folder. For a household, or an app that wants it.
          env:
            GF_DATABASE_HOST: postgres
            GF_DATABASE_TYPE: postgres
          defaults:
            DATABASE_LOCATION: '{{base}}/{{stack}}/postgres'
            GF_DATABASE_NAME: grafana
            GF_DATABASE_USER: grafana
          secrets:
            - GF_DATABASE_PASSWORD
          services: |
            postgres:
              image: ghcr.io/daemonless/postgres:17
              restart: always
              annotations:
                org.freebsd.jail.allow.sysvipc: "true"
              environment:
                - POSTGRES_USER=${GF_DATABASE_USER}
                - POSTGRES_PASSWORD=${GF_DATABASE_PASSWORD}
                - POSTGRES_DB=${GF_DATABASE_NAME}
              volumes:
                - "${DATABASE_LOCATION}:/var/lib/postgresql/data"
          depends_on:
            grafana:
              - postgres
          hostnames:
            postgres: GF_DATABASE_HOST
          appjail:
            director: |
              services:
                postgres:
                  name: grafana_postgres
                  priority: 10
                  options:
                  - from: ghcr.io/daemonless/postgres:17
                  - template: !ENV '${PWD}/postgres-template.conf'
                  oci:
                    environment:
                    - POSTGRES_USER: !ENV '${GF_DATABASE_USER}'
                    - POSTGRES_PASSWORD: !ENV '${GF_DATABASE_PASSWORD}'
                    - POSTGRES_DB: !ENV '${GF_DATABASE_NAME}'
                  volumes:
                  - database: /var/lib/postgresql/data
              volumes:
                database:
                  device: !ENV '${DATABASE_LOCATION}'
            files:
              postgres-template.conf: |
                # The jail PostgreSQL runs in: SysV shared memory, which a jail does not
                # get by default. ip4/ip6 are set here because the director's ip4_inherit
                # option is a no-op in AppJail 5.5.0.

                exec.start: "/bin/sh /etc/rc"
                exec.stop: "/bin/sh /etc/rc.shutdown jail"
                sysvmsg: new
                sysvsem: new
                sysvshm: new
                mount.devfs
                persist
                ip4: inherit
                ip6: inherit
            hostnames:
              postgres: GF_DATABASE_HOST
        - id: mariadb
          label: MariaDB
          doc: One more container, its data in its own folder. If you already know MariaDB, or the app prefers it.
          env:
            GF_DATABASE_HOST: mariadb
            GF_DATABASE_TYPE: mysql
          defaults:
            DATABASE_LOCATION: '{{base}}/{{stack}}/mariadb'
            GF_DATABASE_NAME: grafana
            GF_DATABASE_USER: grafana
          secrets:
            - GF_DATABASE_PASSWORD
          services: |
            mariadb:
              image: ghcr.io/daemonless/mariadb:11.4
              restart: always
              environment:
                - MYSQL_USER=${GF_DATABASE_USER}
                - MYSQL_PASSWORD=${GF_DATABASE_PASSWORD}
                - MYSQL_DATABASE=${GF_DATABASE_NAME}
                - MYSQL_ROOT_PASSWORD=${GF_DATABASE_PASSWORD}
              volumes:
                - "${DATABASE_LOCATION}:/config"
          depends_on:
            grafana:
              - mariadb
          hostnames:
            mariadb: GF_DATABASE_HOST
          appjail:
            director: |
              services:
                mariadb:
                  name: grafana_mariadb
                  priority: 10
                  options:
                  - from: ghcr.io/daemonless/mariadb:11.4
                  - template: !ENV '${PWD}/template.conf'
                  oci:
                    environment:
                    - MYSQL_USER: !ENV '${GF_DATABASE_USER}'
                    - MYSQL_PASSWORD: !ENV '${GF_DATABASE_PASSWORD}'
                    - MYSQL_DATABASE: !ENV '${GF_DATABASE_NAME}'
                    - MYSQL_ROOT_PASSWORD: !ENV '${GF_DATABASE_PASSWORD}'
                  volumes:
                  - database: /config
              volumes:
                database:
                  device: !ENV '${DATABASE_LOCATION}'
            hostnames:
              mariadb: GF_DATABASE_HOST
        - id: external
          label: Your own
          doc: A database you already run, here or on another machine. Nothing extra runs; you give the address and the account.
          ask:
            - name: GF_DATABASE_TYPE
              label: Kind
              type: string
              values:
                mysql: MariaDB
                postgres: PostgreSQL
            - name: GF_DATABASE_HOST
              label: Host
              type: string
            - name: GF_DATABASE_USER
              label: User
              type: string
            - name: GF_DATABASE_PASSWORD
              label: Password
              type: secret
            - name: GF_DATABASE_NAME
              label: Database
              type: string
