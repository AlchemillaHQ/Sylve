name: garage
services:
  garage:
    image: ghcr.io/daemonless/garage:latest
    container_name: garage
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Listed here, not just under docs.env: fjord derives its install-wizard
      # fields from this block, so anything absent is never offered.
      - RPC_SECRET=${RPC_SECRET}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - RPC_PUBLIC_ADDR=${RPC_PUBLIC_ADDR}
      - GARAGE_AUTO_LAYOUT=${GARAGE_AUTO_LAYOUT}
      - GARAGE_ZONE=${GARAGE_ZONE}
      - GARAGE_CAPACITY=${GARAGE_CAPACITY}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${DATA_PATH}:/data"
    ports:
      - "${WEB_PORT}:3900"
      - "${PORT_3901}:3901"
      - "${PORT_3902}:3902"
      - "${PORT_3903}:3903"
x-fjord:
  version: "0.1"
  info:
    id: garage
    name: Garage
    description: Lightweight, geo-distributed S3-compatible object storage service designed for self-hosting on commodity hardware.
    category: Network
    class: service
    icon: icons/garage.svg
    upstream_url: https://git.deuxfleurs.fr/Deuxfleurs/garage
    web_url: https://garagehq.deuxfleurs.fr/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: S3 API endpoint
      type: port
      default: "3900"
    - name: PORT_3901
      label: RPC endpoint for inter-cluster node communication
      type: port
      default: "3901"
    - name: PORT_3902
      label: S3 web endpoint (static website hosting)
      type: port
      default: "3902"
    - name: PORT_3903
      label: Admin API and Prometheus metrics endpoint
      type: port
      default: "3903"
    - name: CONFIG_DATA
      label: Configuration directory containing garage.toml
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: DATA_PATH
      label: 'Object storage: metadata in /data/meta, data blocks in /data/data'
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: RPC_SECRET
      label: 32-byte hex RPC secret for cluster authentication (auto-generated on first run if unset)
      type: secret
      default: ""
      optional: true
    - name: ADMIN_TOKEN
      label: Admin API and metrics authorization bearer token (auto-generated on first run if unset)
      type: secret
      default: ""
      optional: true
    - name: RPC_PUBLIC_ADDR
      label: Address other cluster nodes reach this one on. The default suits a single node; clustering needs a routable address.
      type: string
      default: 127.0.0.1:3901
      optional: true
      level: advanced
    - name: GARAGE_AUTO_LAYOUT
      label: Assign a single-node layout on first boot so the node stores data without manual setup. Set false when joining an existing cluster.
      type: string
      default: "true"
      optional: true
      level: advanced
    - name: GARAGE_ZONE
      label: Zone name used by the automatic single-node layout
      type: string
      default: dc1
      optional: true
      level: advanced
    - name: GARAGE_CAPACITY
      label: Storage this node advertises to the cluster, e.g. 10G or 2T
      type: string
      default: 10G
      optional: true
      level: advanced
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
      aliases:
        - latest
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        garage:
          name: garage
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:3900 proto:tcp'
            - expose: '3901:3901 proto:tcp'
            - expose: '3902:3902 proto:tcp'
            - expose: '3903:3903 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - RPC_SECRET: !ENV '${RPC_SECRET}'
              - ADMIN_TOKEN: !ENV '${ADMIN_TOKEN}'
              - RPC_PUBLIC_ADDR: !ENV '${RPC_PUBLIC_ADDR}'
              - GARAGE_AUTO_LAYOUT: !ENV '${GARAGE_AUTO_LAYOUT}'
              - GARAGE_ZONE: !ENV '${GARAGE_ZONE}'
              - GARAGE_CAPACITY: !ENV '${GARAGE_CAPACITY}'
          volumes:
            - GARAGE_CONFIG_PATH: /config
            - GARAGE_DATA_PATH: /data
      volumes:
        GARAGE_CONFIG_PATH:
          device: !ENV '${GARAGE_CONFIG_PATH}'
        GARAGE_DATA_PATH:
          device: !ENV '${GARAGE_DATA_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/garage:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=garage
      PUID=1000
      PGID=1000
      TZ=UTC
      RPC_SECRET=${RPC_SECRET}
      ADMIN_TOKEN=${ADMIN_TOKEN}
      RPC_PUBLIC_ADDR=${RPC_PUBLIC_ADDR:-127.0.0.1:3901}
      GARAGE_AUTO_LAYOUT=${GARAGE_AUTO_LAYOUT:-true}
      GARAGE_ZONE=${GARAGE_ZONE:-dc1}
      GARAGE_CAPACITY=${GARAGE_CAPACITY:-10G}
      WEB_PORT=3900
      GARAGE_CONFIG_PATH=/garage
      GARAGE_DATA_PATH=/garage/data
