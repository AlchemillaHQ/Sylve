name: radicale
services:
  radicale:
    image: ghcr.io/daemonless/radicale:latest
    container_name: radicale
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - RADICALE_USER=${RADICALE_USER}
      - RADICALE_PASSWORD=${RADICALE_PASSWORD}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:5232"
x-fjord:
  version: "0.1"
  info:
    id: radicale
    name: Radicale
    description: Radicale is a lightweight CalDAV (calendar, todo-lists) and CardDAV (contacts) server.
    category: Productivity
    class: service
    icon: icons/radicale.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/Kozea/Radicale
    web_url: https://radicale.org/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: CalDAV/CardDAV and Web UI
      type: port
      default: "5232"
    - name: CONFIG_DATA
      label: Configuration, users file, and collections storage
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: RADICALE_USER
      label: Login name. With RADICALE_PASSWORD, turns on password login when the config is first created; leave both empty for no login
      type: string
      default: ""
      optional: true
    - name: RADICALE_PASSWORD
      label: Password for RADICALE_USER (set again and restart to change it)
      type: secret
      default: ""
      optional: true
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
      default: true
      aliases:
        - latest
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        radicale:
          name: radicale
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:5232 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - RADICALE_USER: !ENV '${RADICALE_USER}'
              - RADICALE_PASSWORD: !ENV '${RADICALE_PASSWORD}'
          volumes:
            - RADICALE_CONFIG_PATH: /config
      volumes:
        RADICALE_CONFIG_PATH:
          device: !ENV '${RADICALE_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/radicale:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=radicale
      PUID=1000
      PGID=1000
      TZ=UTC
      RADICALE_USER=
      RADICALE_PASSWORD=<RADICALE_PASSWORD>
      WEB_PORT=5232
      RADICALE_CONFIG_PATH=/radicale
