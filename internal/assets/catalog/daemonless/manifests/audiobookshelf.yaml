name: audiobookshelf
services:
  audiobookshelf:
    image: ghcr.io/daemonless/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${METADATA_PATH}:/metadata"
      - "${AUDIOBOOKS_PATH}:/audiobooks"
    ports:
      - "${WEB_PORT}:13378"
x-fjord:
  version: "0.1"
  info:
    id: audiobookshelf
    name: Audiobookshelf
    description: Self-hosted audiobook and podcast server.
    category: Media Servers
    class: service
    icon: icons/audiobookshelf.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/advplyr/audiobookshelf
    web_url: https://www.audiobookshelf.org/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "13378"
    - name: CONFIG_DATA
      label: Configuration and database
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: METADATA_PATH
      label: Metadata cache
      type: path
      default: ""
    - name: AUDIOBOOKS_PATH
      label: Audiobook library path
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        audiobookshelf:
          name: audiobookshelf
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:13378 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - AUDIOBOOKSHELF_CONFIG_PATH: /config
            - AUDIOBOOKSHELF_METADATA_PATH: /metadata
            - AUDIOBOOKSHELF_AUDIOBOOKS_PATH: /audiobooks
      volumes:
        AUDIOBOOKSHELF_CONFIG_PATH:
          device: !ENV '${AUDIOBOOKSHELF_CONFIG_PATH}'
        AUDIOBOOKSHELF_METADATA_PATH:
          device: !ENV '${AUDIOBOOKSHELF_METADATA_PATH}'
        AUDIOBOOKSHELF_AUDIOBOOKS_PATH:
          device: !ENV '${AUDIOBOOKSHELF_AUDIOBOOKS_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/audiobookshelf:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=audiobookshelf
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=13378
      AUDIOBOOKSHELF_CONFIG_PATH=/audiobookshelf
      AUDIOBOOKSHELF_METADATA_PATH=/audiobookshelf/metadata
      AUDIOBOOKSHELF_AUDIOBOOKS_PATH=/audiobookshelf/audiobooks
