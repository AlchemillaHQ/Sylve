name: superset
services:
  superset:
    image: ghcr.io/daemonless/superset:latest
    container_name: superset
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8088"
x-fjord:
  version: "0.1"
  info:
    id: superset
    name: Superset
    description: Modern data exploration and visualization platform — build charts, dashboards, and SQL-driven analytics on top of your databases.
    category: Productivity
    class: service
    icon: icons/superset.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/apache/superset
    web_url: https://superset.apache.org/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8088"
    - name: CONFIG_DATA
      label: 'Superset home: metadata DB, secret key, uploads'
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        superset:
          name: superset
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8088 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - SUPERSET_CONFIG_PATH: /config
      volumes:
        SUPERSET_CONFIG_PATH:
          device: !ENV '${SUPERSET_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/superset:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=superset
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=8088
      SUPERSET_CONFIG_PATH=/superset
