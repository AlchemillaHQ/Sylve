name: plausible
services:
  plausible:
    image: ghcr.io/daemonless/plausible:latest
    container_name: plausible
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - BASE_URL=${BASE_URL:-http://localhost:8000}
      # Generated into /config/secrets.env on first start if unset.
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-}
      - TOTP_VAULT_KEY=${TOTP_VAULT_KEY:-}
      # Plausible connects to the postgres and clickhouse below with these.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-plausible}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-plausible}
      # Databases of your own instead:
      # - DATABASE_URL=postgres://plausible:secret@db.example.com:5432/plausible_db
      # - CLICKHOUSE_DATABASE_URL=http://default:secret@ch.example.com:8123/plausible_events_db
      # Upstream's default: after the first account, new users only by invitation.
      - DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-invite_only}
    depends_on:
      - postgres
      - clickhouse
    volumes:
      - ${CONFIG_LOCATION}:/config
  postgres:
    image: ghcr.io/daemonless/postgres:latest
    container_name: plausible-postgres
    restart: unless-stopped
    network_mode: host
    # Needs SysV IPC
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      - POSTGRES_USER=plausible
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-plausible}
      - POSTGRES_DB=plausible_db
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ${POSTGRES_DATA_LOCATION}:/var/lib/postgresql/data
  clickhouse:
    image: ghcr.io/daemonless/clickhouse:pkg-latest
    container_name: plausible-clickhouse
    restart: unless-stopped
    network_mode: host
    # ClickHouse on FreeBSD needs the long stop: see its image notes.
    stop_grace_period: 60s
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-plausible}
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
    volumes:
      - ${CLICKHOUSE_DATA_LOCATION}:/var/db/clickhouse
x-fjord:
  version: "0.1"
  info:
    id: plausible
    name: Plausible Analytics
    description: 'Privacy-first web analytics: one lightweight script, no cookies, a dashboard anyone can read. Runs with PostgreSQL and ClickHouse.'
    category: Monitoring
    class: stack
    icon: icons/plausible.svg
    web_port: "8000"
    upstream_url: https://github.com/plausible/analytics
    web_url: https://plausible.io/
  variables:
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
      optional: true
    - name: BASE_URL
      label: Full public URL of this instance, e.g. https://plausible.example.com. The tracking script and every link use it
      type: string
      default: http://localhost:8000
      optional: true
      level: primary
    - name: SECRET_KEY_BASE
      label: Optional. 64+ random bytes, base64 (`openssl rand -base64 48`). Generated into /config/secrets.env on first start if unset
      type: secret
      default: ""
      optional: true
      level: primary
    - name: TOTP_VAULT_KEY
      label: Optional. 32 random bytes, base64 (`openssl rand -base64 32`), encrypts 2FA secrets. Generated alongside SECRET_KEY_BASE if unset
      type: secret
      default: ""
      optional: true
    - name: POSTGRES_PASSWORD
      label: Password for the bundled PostgreSQL (letters and digits only). Set it once, before the first start
      type: secret
      default: plausible
      optional: true
      level: primary
    - name: CLICKHOUSE_PASSWORD
      label: Password for the bundled ClickHouse (letters and digits only). Set it once, before the first start
      type: secret
      default: plausible
      optional: true
      level: primary
    - name: DISABLE_REGISTRATION
      label: '`invite_only` (default): after the first account, new users join by invitation. `true` closes sign-up entirely, `false` opens it to anyone'
      type: string
      default: invite_only
      optional: true
      level: primary
    - name: CONFIG_LOCATION
      type: path
      default: /containers/plausible
    - name: POSTGRES_DATA_LOCATION
      type: path
      default: /containers/plausible-postgres
    - name: CLICKHOUSE_DATA_LOCATION
      type: path
      default: /containers/plausible-clickhouse
  appjail:
    director: |
      # appjail-director.yml

      options:
        - alias:
        - ip4_inherit:
      services:
        plausible:
          name: plausible
          options:
            - container: 'args:--pull'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - BASE_URL: !ENV '${BASE_URL}'
              - SECRET_KEY_BASE: !ENV '${SECRET_KEY_BASE}'
              - TOTP_VAULT_KEY: !ENV '${TOTP_VAULT_KEY}'
              - POSTGRES_PASSWORD: !ENV '${POSTGRES_PASSWORD}'
              - CLICKHOUSE_PASSWORD: !ENV '${CLICKHOUSE_PASSWORD}'
              - DISABLE_REGISTRATION: !ENV '${DISABLE_REGISTRATION}'
          volumes:
            - PLAUSIBLE_CONFIG_PATH: /config
        plausible-postgres:
          name: plausible_postgres
          options:
            - from: ghcr.io/daemonless/postgres:latest
            - template: !ENV '${PWD}/postgres-template.conf'
          volumes:
            - postgres_data: /var/lib/postgresql/data
        plausible-clickhouse:
          name: plausible_clickhouse
          options:
            - from: ghcr.io/daemonless/clickhouse:pkg-latest
            - template: !ENV '${PWD}/template.conf'
          volumes:
            - clickhouse_data: /var/db/clickhouse
      volumes:
        PLAUSIBLE_CONFIG_PATH:
          device: !ENV '${PLAUSIBLE_CONFIG_PATH}'
        postgres_data:
          device: !ENV '${POSTGRES_DATA_LOCATION}'
        clickhouse_data:
          device: !ENV '${CLICKHOUSE_DATA_LOCATION}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/plausible:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
      ip4: inherit
      ip6: inherit
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=plausible
      PUID=1000
      PGID=1000
      TZ=UTC
      BASE_URL=http://localhost:8000
      SECRET_KEY_BASE=<SECRET_KEY_BASE>
      TOTP_VAULT_KEY=<TOTP_VAULT_KEY>
      POSTGRES_PASSWORD=plausible
      CLICKHOUSE_PASSWORD=plausible
      DISABLE_REGISTRATION=invite_only
      PLAUSIBLE_CONFIG_PATH=/plausible
    extras:
      postgres-template.conf: |
        # postgres-template.conf -- jail template for the PostgreSQL sidecar (AppJail)
        #
        # PostgreSQL needs System V shared memory. allow.sysvipc is a no-op on
        # FreeBSD 15; the jail gets its own SysV IPC namespace instead.
        exec.start: "/bin/sh /etc/rc"
        exec.stop: "/bin/sh /etc/rc.shutdown jail"
        mount.devfs
        persist
        # host networking (ip4_inherit is a no-op in AppJail 5.5.0; the parameters are not)
        ip4: inherit
        ip6: inherit
        sysvmsg: new
        sysvsem: new
        sysvshm: new
