name: haproxy
services:
  haproxy:
    image: ghcr.io/daemonless/haproxy:latest
    container_name: haproxy
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:80"
      - "${PORT_443}:443"
      - "${PORT_8404}:8404"
x-fjord:
  version: "0.1"
  info:
    id: haproxy
    name: HAProxy
    description: Reliable, high performance TCP/HTTP load balancer and reverse proxy.
    category: Infrastructure
    class: service
    icon: icons/haproxy.svg
    upstream_url: https://github.com/haproxy/haproxy
    web_url: https://www.haproxy.org/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: HTTP Listener
      type: port
      default: "80"
    - name: PORT_443
      label: HTTPS Listener (optional)
      type: port
      default: "443"
      optional: true
    - name: PORT_8404
      label: HAProxy Stats Page (optional)
      type: port
      default: "8404"
      optional: true
    - name: CONFIG_DATA
      label: Configuration directory containing haproxy.conf
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: 3.4-pkg-latest
      label: HAProxy 3.4 release branch installed from FreeBSD latest packages.
      default: true
      aliases:
        - "3.4"
        - '{version}'
        - latest
        - pkg
        - pkg-latest
    - id: 3.3-pkg-latest
      label: HAProxy 3.3 release branch installed from FreeBSD latest packages.
      aliases:
        - "3.3"
        - '{version}'
    - id: 3.2-pkg-latest
      label: HAProxy 3.2 LTS release branch installed from FreeBSD latest packages.
      aliases:
        - "3.2"
        - '{version}'
        - lts
    - id: 3.0-pkg-latest
      label: HAProxy 3.0 LTS release branch installed from FreeBSD latest packages.
      aliases:
        - "3.0"
        - '{version}'
    - id: 2.8-pkg-latest
      label: HAProxy 2.8 LTS release branch installed from FreeBSD latest packages.
      aliases:
        - "2.8"
        - '{version}'
    - id: 2.6-pkg-latest
      label: HAProxy 2.6 LTS release branch installed from FreeBSD latest packages.
      aliases:
        - "2.6"
        - '{version}'
    - id: devel-pkg-latest
      label: HAProxy development edge release branch installed from FreeBSD latest packages.
      aliases:
        - devel
    - id: 3.4-lua-pkg-latest
      label: HAProxy 3.4 release branch with Lua scripting enabled.
      aliases:
        - 3.4-lua
        - '{version}-lua'
        - lua
    - id: 3.3-lua-pkg-latest
      label: HAProxy 3.3 release branch with Lua scripting enabled.
      aliases:
        - 3.3-lua
        - '{version}-lua'
    - id: 3.2-lua-pkg-latest
      label: HAProxy 3.2 LTS release branch with Lua scripting enabled.
      aliases:
        - 3.2-lua
        - '{version}-lua'
    - id: 3.0-lua-pkg-latest
      label: HAProxy 3.0 LTS release branch with Lua scripting enabled.
      aliases:
        - 3.0-lua
        - '{version}-lua'
    - id: 2.8-lua-pkg-latest
      label: HAProxy 2.8 LTS release branch with Lua scripting enabled.
      aliases:
        - 2.8-lua
        - '{version}-lua'
    - id: 2.6-lua-pkg-latest
      label: HAProxy 2.6 LTS release branch with Lua scripting enabled.
      aliases:
        - 2.6-lua
        - '{version}-lua'
    - id: 3.4-wolfssl-pkg-latest
      label: HAProxy 3.4 release branch built with WolfSSL TLS engine.
      aliases:
        - 3.4-wolfssl
        - '{version}-wolfssl'
        - wolfssl
    - id: 3.3-wolfssl-pkg-latest
      label: HAProxy 3.3 release branch built with WolfSSL TLS engine.
      aliases:
        - 3.3-wolfssl
        - '{version}-wolfssl'
    - id: 3.2-wolfssl-pkg-latest
      label: HAProxy 3.2 LTS release branch built with WolfSSL TLS engine.
      aliases:
        - 3.2-wolfssl
        - '{version}-wolfssl'
    - id: 3.0-wolfssl-pkg-latest
      label: HAProxy 3.0 LTS release branch built with WolfSSL TLS engine.
      aliases:
        - 3.0-wolfssl
        - '{version}-wolfssl'
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        haproxy:
          name: haproxy
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:80 proto:tcp'
            - expose: '443:443 proto:tcp'
            - expose: '8404:8404 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - HAPROXY_CONFIG_PATH: /config
      volumes:
        HAPROXY_CONFIG_PATH:
          device: !ENV '${HAPROXY_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/haproxy:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=haproxy
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=80
      HAPROXY_CONFIG_PATH=/haproxy
