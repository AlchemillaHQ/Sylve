name: uptime-kuma
services:
  uptime-kuma:
    image: ghcr.io/daemonless/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    annotations:
      org.freebsd.jail.allow.raw_sockets: "true"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UPTIME_KUMA_IS_CONTAINER=${UPTIME_KUMA_IS_CONTAINER}
      - UPTIME_KUMA_ALLOW_ALL_CHROME_EXEC=${UPTIME_KUMA_ALLOW_ALL_CHROME_EXEC}
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=${PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD}
      - DATA_DIR=${DATA_DIR}
      - UPTIME_KUMA_DB_TYPE=${UPTIME_KUMA_DB_TYPE}
      - UPTIME_KUMA_DB_HOSTNAME=${UPTIME_KUMA_DB_HOSTNAME}
      - UPTIME_KUMA_DB_PORT=${UPTIME_KUMA_DB_PORT}
      - UPTIME_KUMA_DB_USERNAME=${UPTIME_KUMA_DB_USERNAME}
      - UPTIME_KUMA_DB_PASSWORD=${UPTIME_KUMA_DB_PASSWORD}
      - UPTIME_KUMA_DB_NAME=${UPTIME_KUMA_DB_NAME}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:3001"
x-fjord:
  version: "0.1"
  info:
    id: uptime-kuma
    name: Uptime Kuma
    description: Self-hosted uptime monitoring tool with a beautiful dashboard, status pages, and multi-channel notifications.
    category: Utilities
    class: service
    icon: icons/uptime-kuma.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/louislam/uptime-kuma
    web_url: https://uptime.kuma.pet/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "3001"
    - name: CONFIG_DATA
      label: Data directory (database, settings)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: UPTIME_KUMA_IS_CONTAINER
      type: string
      default: "1"
    - name: UPTIME_KUMA_ALLOW_ALL_CHROME_EXEC
      type: string
      default: "1"
    - name: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
      type: string
      default: "1"
    - name: DATA_DIR
      type: string
      default: /config
    - name: UPTIME_KUMA_DB_TYPE
      label: 'sqlite or mariadb; set by the Database choice. Empty: uptime-kuma asks on first run'
      type: string
      default: ""
      optional: true
    - name: UPTIME_KUMA_DB_HOSTNAME
      label: MariaDB host (Database choice)
      type: string
      default: ""
      optional: true
    - name: UPTIME_KUMA_DB_PORT
      label: MariaDB port (Database choice)
      type: string
      default: "3306"
      optional: true
    - name: UPTIME_KUMA_DB_USERNAME
      label: MariaDB user (Database choice)
      type: string
      default: ""
      optional: true
    - name: UPTIME_KUMA_DB_PASSWORD
      label: MariaDB password (Database choice)
      type: secret
      default: ""
      optional: true
    - name: UPTIME_KUMA_DB_NAME
      label: MariaDB database name (Database choice)
      type: string
      default: ""
      optional: true
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        uptime-kuma:
          name: uptime_kuma
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:3001 proto:tcp'
            - template: !ENV '${PWD}/template.conf'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - UPTIME_KUMA_IS_CONTAINER: !ENV '${UPTIME_KUMA_IS_CONTAINER}'
              - UPTIME_KUMA_ALLOW_ALL_CHROME_EXEC: !ENV '${UPTIME_KUMA_ALLOW_ALL_CHROME_EXEC}'
              - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: !ENV '${PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD}'
              - DATA_DIR: !ENV '${DATA_DIR}'
              - UPTIME_KUMA_DB_TYPE: !ENV '${UPTIME_KUMA_DB_TYPE}'
              - UPTIME_KUMA_DB_HOSTNAME: !ENV '${UPTIME_KUMA_DB_HOSTNAME}'
              - UPTIME_KUMA_DB_PORT: !ENV '${UPTIME_KUMA_DB_PORT}'
              - UPTIME_KUMA_DB_USERNAME: !ENV '${UPTIME_KUMA_DB_USERNAME}'
              - UPTIME_KUMA_DB_PASSWORD: !ENV '${UPTIME_KUMA_DB_PASSWORD}'
              - UPTIME_KUMA_DB_NAME: !ENV '${UPTIME_KUMA_DB_NAME}'
          volumes:
            - UPTIME_KUMA_CONFIG_PATH: /config
      volumes:
        UPTIME_KUMA_CONFIG_PATH:
          device: !ENV '${UPTIME_KUMA_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/uptime-kuma:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
      allow.raw_sockets
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=uptime-kuma
      PUID=1000
      PGID=1000
      TZ=UTC
      UPTIME_KUMA_IS_CONTAINER=1
      UPTIME_KUMA_ALLOW_ALL_CHROME_EXEC=1
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      DATA_DIR=/config
      UPTIME_KUMA_DB_TYPE=
      UPTIME_KUMA_DB_HOSTNAME=
      UPTIME_KUMA_DB_PORT=3306
      UPTIME_KUMA_DB_USERNAME=
      UPTIME_KUMA_DB_PASSWORD=<UPTIME_KUMA_DB_PASSWORD>
      UPTIME_KUMA_DB_NAME=
      WEB_PORT=3001
      UPTIME_KUMA_CONFIG_PATH=/uptime-kuma
  networking:
    '*': private
    uptime-kuma: default
  choices:
    - id: database
      kind: database
      label: Database
      doc: Where the app keeps its data. The default needs nothing else running.
      default: sqlite
      options:
        - id: sqlite
          label: SQLite
          doc: A file in the app's config folder. Right for one person, nothing extra to run.
          env:
            UPTIME_KUMA_DB_TYPE: sqlite
        - id: mariadb
          label: MariaDB
          doc: One more container, its data in its own folder. If you already know MariaDB, or the app prefers it.
          env:
            UPTIME_KUMA_DB_HOSTNAME: mariadb
            UPTIME_KUMA_DB_PORT: "3306"
            UPTIME_KUMA_DB_TYPE: mariadb
          defaults:
            DATABASE_LOCATION: '{{base}}/{{stack}}/mariadb'
            UPTIME_KUMA_DB_NAME: uptime-kuma
            UPTIME_KUMA_DB_USERNAME: uptime-kuma
          secrets:
            - UPTIME_KUMA_DB_PASSWORD
          services: |
            mariadb:
              image: ghcr.io/daemonless/mariadb:11.4
              restart: always
              environment:
                - MYSQL_USER=${UPTIME_KUMA_DB_USERNAME}
                - MYSQL_PASSWORD=${UPTIME_KUMA_DB_PASSWORD}
                - MYSQL_DATABASE=${UPTIME_KUMA_DB_NAME}
                - MYSQL_ROOT_PASSWORD=${UPTIME_KUMA_DB_PASSWORD}
              volumes:
                - "${DATABASE_LOCATION}:/config"
          depends_on:
            uptime-kuma:
              - mariadb
          hostnames:
            mariadb: UPTIME_KUMA_DB_HOSTNAME
          appjail:
            director: |
              services:
                mariadb:
                  name: uptime_kuma_mariadb
                  priority: 10
                  options:
                  - from: ghcr.io/daemonless/mariadb:11.4
                  - template: !ENV '${PWD}/template.conf'
                  oci:
                    environment:
                    - MYSQL_USER: !ENV '${UPTIME_KUMA_DB_USERNAME}'
                    - MYSQL_PASSWORD: !ENV '${UPTIME_KUMA_DB_PASSWORD}'
                    - MYSQL_DATABASE: !ENV '${UPTIME_KUMA_DB_NAME}'
                    - MYSQL_ROOT_PASSWORD: !ENV '${UPTIME_KUMA_DB_PASSWORD}'
                  volumes:
                  - database: /config
              volumes:
                database:
                  device: !ENV '${DATABASE_LOCATION}'
            hostnames:
              mariadb: UPTIME_KUMA_DB_HOSTNAME
        - id: external
          label: Your own
          doc: A database you already run, here or on another machine. Nothing extra runs; you give the address and the account.
          ask:
            - name: UPTIME_KUMA_DB_TYPE
              label: Kind
              type: string
              values:
                mariadb: MariaDB
            - name: UPTIME_KUMA_DB_HOSTNAME
              label: Host
              type: string
            - name: UPTIME_KUMA_DB_PORT
              label: Port
              type: string
            - name: UPTIME_KUMA_DB_USERNAME
              label: User
              type: string
            - name: UPTIME_KUMA_DB_PASSWORD
              label: Password
              type: secret
            - name: UPTIME_KUMA_DB_NAME
              label: Database
              type: string
