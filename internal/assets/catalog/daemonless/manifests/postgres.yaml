name: postgres
services:
  postgres:
    image: ghcr.io/daemonless/postgres:latest
    container_name: postgres
    restart: unless-stopped
    # Needs SysV IPC
    annotations:
      org.freebsd.jail.allow.sysvipc: "true"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${DATA_PATH}:/var/lib/postgresql/data"
    ports:
      - "${WEB_PORT}:5432"
x-fjord:
  version: "0.1"
  info:
    id: postgres
    name: PostgreSQL
    description: The World's Most Advanced Open Source Relational Database on FreeBSD.
    category: Databases
    class: service
    icon: icons/postgres.svg
    upstream_url: https://www.postgresql.org/
    web_url: https://www.postgresql.org/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: PostgreSQL port
      type: port
      default: "5432"
    - name: DATA_PATH
      label: Database data directory
      type: path
      default: ""
    - name: POSTGRES_USER
      label: 'Database superuser name (default: postgres)'
      type: string
      default: postgres
    - name: POSTGRES_PASSWORD
      label: Database superuser password
      type: secret
      default: ""
    - name: POSTGRES_DB
      label: 'Default database to create (default: same as user)'
      type: string
      default: postgres
    - name: PUID
      type: string
      default: "1000"
    - name: PGID
      type: string
      default: "1000"
    - name: TZ
      type: string
      default: UTC
  variants:
    - id: 14-pkg-latest
      label: 14-pkg-latest
      aliases:
        - "14"
    - id: 15-pkg-latest
      label: 15-pkg-latest
      aliases:
        - "15"
    - id: 16-pkg-latest
      label: 16-pkg-latest
      aliases:
        - "16"
    - id: 17-pkg-latest
      label: 17-pkg-latest
      aliases:
        - "17"
    - id: 18-pkg-latest
      label: 18-pkg-latest
      default: true
      aliases:
        - "18"
        - latest
        - pkg
        - pkg-latest
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        postgres:
          name: postgres
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:5432 proto:tcp'
            - template: !ENV '${PWD}/template.conf'
          oci:
            user: root
            environment:
              - POSTGRES_USER: !ENV '${POSTGRES_USER}'
              - POSTGRES_PASSWORD: !ENV '${POSTGRES_PASSWORD}'
              - POSTGRES_DB: !ENV '${POSTGRES_DB}'
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - POSTGRES_DATA_PATH: /var/lib/postgresql/data
      volumes:
        POSTGRES_DATA_PATH:
          device: !ENV '${POSTGRES_DATA_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/postgres:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
      allow.sysvipc
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=postgres
      POSTGRES_USER=postgres
      POSTGRES_PASSWORD=postgres
      POSTGRES_DB=postgres
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=5432
      POSTGRES_DATA_PATH=/postgres
