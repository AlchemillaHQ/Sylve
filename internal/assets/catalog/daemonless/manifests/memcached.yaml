name: memcached
services:
  memcached:
    image: ghcr.io/daemonless/memcached:latest
    container_name: memcached
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MEMCACHED_ARGS=${MEMCACHED_ARGS}
    ports:
      - "${WEB_PORT}:11211"
x-fjord:
  version: "0.1"
  info:
    id: memcached
    name: Memcached
    description: High-performance distributed memory object caching system for speeding up dynamic web applications by reducing database load.
    category: Databases
    class: service
    icon: icons/memcached.svg
    upstream_url: https://github.com/memcached/memcached
    web_url: https://memcached.org/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: Memcached TCP port
      type: port
      default: "11211"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: MEMCACHED_ARGS
      label: Extra memcached arguments, e.g. -m 256 -c 2048 (blank for defaults)
      type: string
      default: ""
      optional: true
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
      aliases:
        - latest
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        memcached:
          name: memcached
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:11211 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - MEMCACHED_ARGS: !ENV '${MEMCACHED_ARGS}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/memcached:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=memcached
      PUID=1000
      PGID=1000
      TZ=UTC
      MEMCACHED_ARGS=
      WEB_PORT=11211
