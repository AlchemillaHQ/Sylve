name: radicale
services:
  radicale:
    image: ghcr.io/daemonless/opencloud-radicale:latest
    container_name: opencloud-radicale
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:5232"
x-fjord:
  version: "0.1"
  info:
    id: opencloud-radicale
    name: OpenCloud-Radicale
    description: A simple CalDAV (calendar) and CardDAV (contact) server.
    category: Utilities
    class: service
    icon: https://api.iconify.design/mdi:apps.svg?color=%23cbd5e1
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/daemonless/opencloud-radicale
    web_url: https://radicale.org/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "5232"
    - name: CONFIG_DATA
      label: Configuration and data directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        radicale:
          name: radicale
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:5232 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - OPENCLOUD_RADICALE_CONFIG_PATH: /config
      volumes:
        OPENCLOUD_RADICALE_CONFIG_PATH:
          device: !ENV '${OPENCLOUD_RADICALE_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/opencloud-radicale:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=opencloud-radicale
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=5232
      OPENCLOUD_RADICALE_CONFIG_PATH=/opencloud-radicale
