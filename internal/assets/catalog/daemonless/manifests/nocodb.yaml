name: nocodb
services:
  nocodb:
    image: ghcr.io/daemonless/nocodb:latest
    container_name: nocodb
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8080"
x-fjord:
  version: "0.1"
  info:
    id: nocodb
    name: NocoDB
    description: Free and self-hostable Airtable alternative — turn any database into a smart spreadsheet.
    category: Utilities
    class: service
    icon: icons/nocodb.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/nocodb/nocodb
    web_url: https://nocodb.com/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8080"
    - name: CONFIG_DATA
      label: Configuration directory (SQLite database, uploaded attachments)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        nocodb:
          name: nocodb
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8080 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - NOCODB_CONFIG_PATH: /config
      volumes:
        NOCODB_CONFIG_PATH:
          device: !ENV '${NOCODB_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/nocodb:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=nocodb
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=8080
      NOCODB_CONFIG_PATH=/nocodb
