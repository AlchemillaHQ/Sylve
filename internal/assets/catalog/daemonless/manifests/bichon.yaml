name: bichon
services:
  bichon:
    image: ghcr.io/daemonless/bichon:latest
    container_name: bichon
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - BICHON_ENCRYPT_PASSWORD=${BICHON_ENCRYPT_PASSWORD}
    volumes:
      - "${DATA_PATH}:/data"
    ports:
      - published: 15630
        target: 15630
x-fjord:
  version: "0.1"
  info:
    id: bichon
    name: Bichon
    description: A lightweight, high-performance Rust email archiver with WebUI.
    category: Utilities
    class: service
    icon: icons/bichon.svg
    web_port: "15630"
    upstream_url: https://github.com/rustmailer/bichon
    web_url: https://github.com/rustmailer/bichon
  variables:
    - name: DATA_PATH
      label: Core data and search indices
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: BICHON_ENCRYPT_PASSWORD
      label: Encryption password for core database
      type: secret
      default: ""
  variants:
    - id: latest
      label: Latest
      default: true
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        bichon:
          name: bichon
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:15630 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - BICHON_ENCRYPT_PASSWORD: !ENV '${BICHON_ENCRYPT_PASSWORD}'
          volumes:
            - BICHON_DATA_PATH: /data
      volumes:
        BICHON_DATA_PATH:
          device: !ENV '${BICHON_DATA_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/bichon:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=bichon
      PUID=1000
      PGID=1000
      TZ=UTC
      BICHON_ENCRYPT_PASSWORD=changeme
      WEB_PORT=15630
      BICHON_DATA_PATH=/bichon
