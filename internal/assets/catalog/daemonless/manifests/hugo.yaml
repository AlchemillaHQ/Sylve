name: hugo
services:
  hugo:
    image: ghcr.io/daemonless/hugo:latest
    container_name: hugo
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - HUGO_BASEURL=${HUGO_BASEURL}
    volumes:
      - "${APP_PATH}:/app"
    ports:
      - "${WEB_PORT}:1313"
x-fjord:
  version: "0.1"
  info:
    id: hugo
    name: Hugo
    description: Fast and flexible static site generator — builds your entire site at creation time rather than on each request.
    category: Development
    class: service
    icon: icons/hugo.svg
    upstream_url: https://github.com/gohugoio/hugo
    web_url: https://gohugo.io/
  variables:
    - name: WEB_PORT
      label: Dev Server Port
      type: port
      default: "1313"
    - name: APP_PATH
      label: Website source code (mount your repo here)
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: HUGO_BASEURL
      label: Hostname (and path) to the root
      type: string
      default: http://localhost:1313
  variants:
    - id: latest
      label: Latest
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        hugo:
          name: hugo
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:1313 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - HUGO_BASEURL: !ENV '${HUGO_BASEURL}'
          volumes:
            - HUGO_APP_PATH: /app
      volumes:
        HUGO_APP_PATH:
          device: !ENV '${HUGO_APP_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/hugo:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=hugo
      PUID=1000
      PGID=1000
      TZ=UTC
      HUGO_BASEURL=http://localhost:1313
      WEB_PORT=1313
      HUGO_APP_PATH=/hugo/app
