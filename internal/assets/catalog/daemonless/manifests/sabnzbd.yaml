name: sabnzbd
services:
  sabnzbd:
    image: ghcr.io/daemonless/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${DOWNLOADS_PATH}:/downloads"
    ports:
      - "${WEB_PORT}:8080"
x-fjord:
  version: "0.1"
  info:
    id: sabnzbd
    name: SABnzbd
    description: Free and easy binary newsreader that automates the downloading and processing of Usenet content.
    category: Downloaders
    class: service
    icon: icons/sabnzbd.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/sabnzbd/sabnzbd
    web_url: https://sabnzbd.org/
    only_for_archs:
      - amd64
      - aarch64
    name_env:
      HOST_ALLOWLIST: '{names}'
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8080"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: DOWNLOADS_PATH
      label: Download directory
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        sabnzbd:
          name: sabnzbd
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8080 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - SABNZBD_CONFIG_PATH: /config
            - DOWNLOADS_PATH: /downloads
      volumes:
        SABNZBD_CONFIG_PATH:
          device: !ENV '${SABNZBD_CONFIG_PATH}'
        DOWNLOADS_PATH:
          device: !ENV '${DOWNLOADS_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/sabnzbd:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=sabnzbd
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=8080
      SABNZBD_CONFIG_PATH=/sabnzbd
      DOWNLOADS_PATH=downloads
