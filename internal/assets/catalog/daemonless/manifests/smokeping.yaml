name: smokeping
services:
  smokeping:
    image: ghcr.io/daemonless/smokeping:latest
    container_name: smokeping
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${DATA_PATH}:/data"
    ports:
      - "${WEB_PORT}:80"
x-fjord:
  version: "0.1"
  info:
    id: smokeping
    name: SmokePing
    description: Network latency monitor with historical graphing — tracks round-trip times and packet loss to your hosts over time.
    category: Utilities
    class: service
    icon: icons/smokeping.png
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/oetiker/smokeping
    web_url: https://oss.oetiker.ch/smokeping/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "80"
    - name: CONFIG_DATA
      label: Configuration directory (Probes, Targets, etc.)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: DATA_PATH
      label: Data directory (RRD database files)
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
      default: true
      aliases:
        - latest
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        smokeping:
          name: smokeping
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:80 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - SMOKEPING_CONFIG_PATH: /config
            - SMOKEPING_DATA_PATH: /data
      volumes:
        SMOKEPING_CONFIG_PATH:
          device: !ENV '${SMOKEPING_CONFIG_PATH}'
        SMOKEPING_DATA_PATH:
          device: !ENV '${SMOKEPING_DATA_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/smokeping:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=smokeping
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=80
      SMOKEPING_CONFIG_PATH=/smokeping
      SMOKEPING_DATA_PATH=/smokeping/data
