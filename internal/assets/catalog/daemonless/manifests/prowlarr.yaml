name: prowlarr
services:
  prowlarr:
    image: ghcr.io/daemonless/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    annotations:
      org.freebsd.jail.allow.mlock: "true"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:9696"
x-fjord:
  version: "0.1"
  info:
    id: prowlarr
    name: Prowlarr
    description: Indexer manager and proxy for Sonarr, Radarr, and other *arr applications — centralizes indexer configuration across your media stack.
    category: Media Management
    class: service
    icon: icons/prowlarr.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/Prowlarr/Prowlarr
    web_url: https://prowlarr.com/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "9696"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
    - id: develop
      label: Develop branch
    - id: nightly
      label: Nightly branch
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        prowlarr:
          name: prowlarr
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:9696 proto:tcp'
            - template: !ENV '${PWD}/template.conf'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - PROWLARR_CONFIG_PATH: /config
      volumes:
        PROWLARR_CONFIG_PATH:
          device: !ENV '${PROWLARR_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/prowlarr:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
      allow.mlock
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=prowlarr
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=9696
      PROWLARR_CONFIG_PATH=/prowlarr
