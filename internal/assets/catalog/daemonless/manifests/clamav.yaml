name: clamav
services:
  clamav:
    image: ghcr.io/daemonless/clamav:latest
    container_name: clamav
    # "always", not "unless-stopped": FreeBSD's podman rc.d only auto-starts
    # containers with restart-policy=always at boot (needs podman_enable=YES).
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:3310"
      - "${PORT_7357}:7357"
x-fjord:
  version: "0.1"
  info:
    id: clamav
    name: ClamAV
    description: 'Open-source anti-virus engine: clamd scans files and mail over TCP, with freshclam keeping signatures current.'
    category: Infrastructure
    class: service
    icon: icons/clamav.svg
    upstream_url: https://github.com/Cisco-Talos/clamav
    web_url: https://www.clamav.net/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: clamd TCP socket (INSTREAM scanning)
      type: port
      default: "3310"
    - name: PORT_7357
      label: clamav-milter, for MTAs such as Stalwart or Postfix
      type: port
      default: "7357"
    - name: CONFIG_DATA
      label: clamd.conf, freshclam.conf and the signature database (db/)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
      default: true
      aliases:
        - latest
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        clamav:
          name: clamav
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:3310 proto:tcp'
            - expose: '7357:7357 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - CLAMAV_CONFIG_PATH: /config
      volumes:
        CLAMAV_CONFIG_PATH:
          device: !ENV '${CLAMAV_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/clamav:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=clamav
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=3310
      CLAMAV_CONFIG_PATH=/clamav
