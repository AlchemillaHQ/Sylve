name: nginx-php-fpm
services:
  nginx-php-fpm:
    image: ghcr.io/daemonless/nginx-php-fpm:latest
    container_name: nginx-php-fpm
    # "always", not "unless-stopped": FreeBSD's podman rc.d only auto-starts
    # containers with restart-policy=always at boot (needs podman_enable=YES).
    restart: always
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # - PHP_EXTENSIONS_EXTRA=redis soap
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:80"
x-fjord:
  version: "0.1"
  info:
    id: nginx-php-fpm
    name: Nginx + PHP-FPM
    description: Nginx with PHP-FPM, composer and the PHP extensions from ports, for running your own PHP sites.
    category: Infrastructure
    class: service
    icon: icons/nginx-php-fpm.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/php/php-src
    web_url: https://www.php.net/
  variables:
    - name: WEB_PORT
      label: Web
      type: port
      default: "80"
    - name: CONFIG_DATA
      label: Web root (/config/www), nginx and PHP configuration
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for php-fpm workers and nginx workers
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for php-fpm workers and nginx workers
      type: string
      default: "1000"
    - name: TZ
      label: Timezone, also used as PHP's date.timezone
      type: string
      default: UTC
  variants:
    - id: 85-pkg
      label: 85-pkg
      default: true
      aliases:
        - "85"
        - pkg
        - latest
    - id: 85-pkg-latest
      label: 85-pkg-latest
      aliases:
        - pkg-latest
    - id: 86-pkg
      label: 86-pkg
      aliases:
        - "86"
    - id: 86-pkg-latest
      label: 86-pkg-latest
    - id: 84-pkg
      label: 84-pkg
      aliases:
        - "84"
    - id: 84-pkg-latest
      label: 84-pkg-latest
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        nginx-php-fpm:
          name: nginx_php_fpm
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:80 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - NGINX_PHP_FPM_CONFIG_PATH: /config
      volumes:
        NGINX_PHP_FPM_CONFIG_PATH:
          device: !ENV '${NGINX_PHP_FPM_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/nginx-php-fpm:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=nginx-php-fpm
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=80
      NGINX_PHP_FPM_CONFIG_PATH=/nginx-php-fpm
