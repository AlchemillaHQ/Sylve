name: sonarr
services:
  sonarr:
    image: ghcr.io/daemonless/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    annotations:
      org.freebsd.jail.allow.mlock: "true"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${TV_PATH}:/tv"
      - "${DOWNLOADS_PATH}:/downloads"
    ports:
      - "${WEB_PORT}:8989"
x-fjord:
  version: "0.1"
  info:
    id: sonarr
    name: Sonarr
    description: Automated TV series collection manager that monitors, grabs, and manages your TV library via Usenet and BitTorrent.
    category: Media Management
    class: service
    icon: icons/sonarr.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/Sonarr/Sonarr
    web_url: https://sonarr.tv/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8989"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: TV_PATH
      label: TV Series library
      type: path
      default: ""
      optional: true
    - name: DOWNLOADS_PATH
      label: Download directory
      type: path
      default: ""
      optional: true
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
    - id: nightly
      label: Develop branch
      aliases:
        - develop
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        sonarr:
          name: sonarr
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8989 proto:tcp'
            - template: !ENV '${PWD}/template.conf'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - SONARR_CONFIG_PATH: /config
            - TV_PATH: /tv
            - DOWNLOADS_PATH: /downloads
      volumes:
        SONARR_CONFIG_PATH:
          device: !ENV '${SONARR_CONFIG_PATH}'
        TV_PATH:
          device: !ENV '${TV_PATH}'
        DOWNLOADS_PATH:
          device: !ENV '${DOWNLOADS_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/sonarr:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
      allow.mlock
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=sonarr
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=8989
      SONARR_CONFIG_PATH=/sonarr
      TV_PATH=tv
      DOWNLOADS_PATH=downloads
