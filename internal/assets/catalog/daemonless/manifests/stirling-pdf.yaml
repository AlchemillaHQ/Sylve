name: stirling-pdf
services:
  stirling-pdf:
    image: ghcr.io/daemonless/stirling-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:8080"
x-fjord:
  version: "0.1"
  info:
    id: stirling-pdf
    name: Stirling-PDF
    description: Locally hosted web application for performing various operations on PDF files — merge, split, compress, convert, OCR, and more.
    category: Utilities
    class: service
    icon: icons/stirling-pdf.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/Stirling-Tools/Stirling-PDF
    web_url: https://www.stirlingpdf.com/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8080"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
    - id: pkg-latest
      label: FreeBSD latest packages
      aliases:
        - pkg
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        stirling-pdf:
          name: stirling_pdf
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8080 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - STIRLING_PDF_CONFIG_PATH: /config
      volumes:
        STIRLING_PDF_CONFIG_PATH:
          device: !ENV '${STIRLING_PDF_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/stirling-pdf:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=stirling-pdf
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=8080
      STIRLING_PDF_CONFIG_PATH=/stirling-pdf
