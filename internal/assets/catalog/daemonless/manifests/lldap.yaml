name: lldap
services:
  lldap:
    image: ghcr.io/daemonless/lldap:latest
    container_name: lldap
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
    ports:
      - "${WEB_PORT}:17170"
      - "${PORT_3890}:3890"
x-fjord:
  version: "0.1"
  info:
    id: lldap
    name: lldap
    description: This project is a lightweight authentication server that provides an opinionated, simplified LDAP interface for authentication.
    category: Infrastructure
    class: service
    icon: icons/lldap.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/lldap/lldap
    web_url: https://github.com/lldap/lldap
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "17170"
    - name: PORT_3890
      label: LDAP
      type: port
      default: "3890"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
    - id: pkg-latest
      label: FreeBSD latest packages
      aliases:
        - latest
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        lldap:
          name: lldap
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:17170 proto:tcp'
            - expose: '3890:3890 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - LLDAP_CONFIG_PATH: /config
      volumes:
        LLDAP_CONFIG_PATH:
          device: !ENV '${LLDAP_CONFIG_PATH}'
    makejail: |
      # Makejail

      ARG tag=pkg

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/lldap:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=lldap
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=17170
      LLDAP_CONFIG_PATH=/lldap
