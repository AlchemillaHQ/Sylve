name: navidrome
services:
  navidrome:
    image: ghcr.io/daemonless/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ND_SCANNER_SCHEDULE=${ND_SCANNER_SCHEDULE}
      - ND_LOGLEVEL=${ND_LOGLEVEL}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${MUSIC_PATH}:/music"
    ports:
      - "${WEB_PORT}:4533"
x-fjord:
  version: "0.1"
  info:
    id: navidrome
    name: Navidrome
    description: Modern Music Server and Streamer compatible with Subsonic/Airsonic.
    category: Media Servers
    class: service
    icon: icons/navidrome.png
    web_port: ${WEB_PORT}
    upstream_url: https://www.navidrome.org/
    web_url: https://www.navidrome.org/
    only_for_archs:
      - amd64
      - aarch64
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "4533"
    - name: CONFIG_DATA
      label: Configuration and data directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: MUSIC_PATH
      label: Folder where your music library is stored
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: ND_SCANNER_SCHEDULE
      label: Schedule for automatic scans.
      type: string
      default: '"@every 1h"'
    - name: ND_LOGLEVEL
      label: Log level. Useful for troubleshooting.
      type: string
      default: info
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
      aliases:
        - latest
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        navidrome:
          name: navidrome
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:4533 proto:tcp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - ND_SCANNER_SCHEDULE: !ENV '${ND_SCANNER_SCHEDULE}'
              - ND_LOGLEVEL: !ENV '${ND_LOGLEVEL}'
          volumes:
            - NAVIDROME_CONFIG_PATH: /config
            - MUSIC_PATH: /music
      volumes:
        NAVIDROME_CONFIG_PATH:
          device: !ENV '${NAVIDROME_CONFIG_PATH}'
        MUSIC_PATH:
          device: !ENV '${MUSIC_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/navidrome:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=navidrome
      PUID=1000
      PGID=1000
      TZ=UTC
      ND_SCANNER_SCHEDULE="@every 1h"
      ND_LOGLEVEL=info
      WEB_PORT=4533
      NAVIDROME_CONFIG_PATH=/navidrome
      MUSIC_PATH=music
