name: adguardhome
services:
  adguardhome:
    image: ghcr.io/daemonless/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONF_PATH}:/opt/adguardhome/conf"
      - "${WORK_PATH}:/opt/adguardhome/work"
    ports:
      - "${WEB_PORT}:3000"
      - "${PORT_53}:53"
      - "${PORT_53_UDP}:53/udp"
      - "${PORT_67_UDP}:67/udp"
      - "${PORT_68_UDP}:68/udp"
      - "${PORT_80}:80"
      - "${PORT_443}:443"
      - "${PORT_443_UDP}:443/udp"
      - "${PORT_784_UDP}:784/udp"
      - "${PORT_853}:853"
      - "${PORT_853_UDP}:853/udp"
      - "${PORT_5443}:5443"
      - "${PORT_5443_UDP}:5443/udp"
      - "${PORT_6060}:6060"
      - "${PORT_8853_UDP}:8853/udp"
x-fjord:
  version: "0.1"
  info:
    id: adguardhome
    name: AdGuard Home
    description: Network-wide ad and tracker blocking DNS server. Covers all devices on your network with no client-side software — includes DoH, DoT, DoQ, and a built-in DHCP server.
    category: Network
    class: service
    icon: icons/adguardhome.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/AdguardTeam/AdGuardHome
    web_url: https://adguard.com/adguard-home.html
  variables:
    - name: WEB_PORT
      label: Web UI (Setup/Admin)
      type: port
      default: "3000"
    - name: PORT_53
      label: DNS (TCP/UDP)
      type: port
      default: "53"
    - name: PORT_53_UDP
      label: DNS (TCP/UDP)
      type: port
      default: "53"
    - name: PORT_67_UDP
      label: DHCP Server
      type: port
      default: "67"
    - name: PORT_68_UDP
      label: DHCP Client
      type: port
      default: "68"
    - name: PORT_80
      label: HTTP
      type: port
      default: "80"
    - name: PORT_443
      label: HTTPS / DNS-over-HTTPS (TCP/UDP)
      type: port
      default: "443"
    - name: PORT_443_UDP
      label: HTTPS / DNS-over-HTTPS (TCP/UDP)
      type: port
      default: "443"
    - name: PORT_784_UDP
      label: DNS-over-QUIC
      type: port
      default: "784"
    - name: PORT_853
      label: DNS-over-TLS (TCP/UDP)
      type: port
      default: "853"
    - name: PORT_853_UDP
      label: DNS-over-TLS (TCP/UDP)
      type: port
      default: "853"
    - name: PORT_5443
      label: DNS-over-HTTPS (TCP/UDP)
      type: port
      default: "5443"
    - name: PORT_5443_UDP
      label: DNS-over-HTTPS (TCP/UDP)
      type: port
      default: "5443"
    - name: PORT_6060
      label: Admin API
      type: port
      default: "6060"
    - name: PORT_8853_UDP
      label: DNS-over-QUIC
      type: port
      default: "8853"
    - name: CONF_PATH
      label: Configuration files
      type: path
      default: ""
    - name: WORK_PATH
      label: Work directory (database, logs, data)
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: latest
      label: Latest
      default: true
    - id: pkg
      label: FreeBSD quarterly packages
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        adguardhome:
          name: adguardhome
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:3000 proto:tcp'
            - expose: '53:53 proto:tcp'
            - expose: '53:53 proto:udp'
            - expose: '67:67 proto:udp'
            - expose: '68:68 proto:udp'
            - expose: '80:80 proto:tcp'
            - expose: '443:443 proto:tcp'
            - expose: '443:443 proto:udp'
            - expose: '784:784 proto:udp'
            - expose: '853:853 proto:tcp'
            - expose: '853:853 proto:udp'
            - expose: '5443:5443 proto:tcp'
            - expose: '5443:5443 proto:udp'
            - expose: '6060:6060 proto:tcp'
            - expose: '8853:8853 proto:udp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - ADGUARDHOME_CONF_PATH: /opt/adguardhome/conf
            - ADGUARDHOME_WORK_PATH: /opt/adguardhome/work
      volumes:
        ADGUARDHOME_CONF_PATH:
          device: !ENV '${ADGUARDHOME_CONF_PATH}'
        ADGUARDHOME_WORK_PATH:
          device: !ENV '${ADGUARDHOME_WORK_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/adguardhome:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=adguardhome
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=3000
      ADGUARDHOME_CONF_PATH=/adguardhome/conf
      ADGUARDHOME_WORK_PATH=/adguardhome/work
