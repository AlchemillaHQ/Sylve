name: qbittorrent
services:
  qbittorrent:
    image: ghcr.io/daemonless/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${WEBUI_PORT}
      - TORRENTING_PORT=${TORRENTING_PORT}
      - WEBUI_PASSWORD=${WEBUI_PASSWORD}
      - WEBUI_AUTH=${WEBUI_AUTH}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${DOWNLOADS_PATH}:/downloads"
    ports:
      - "${WEB_PORT}:8080"
      - "${PORT_6881}:6881"
      - "${PORT_6881_UDP}:6881/udp"
x-fjord:
  version: "0.1"
  info:
    id: qbittorrent
    name: qBittorrent
    description: Fast, stable BitTorrent client with a feature-rich web UI. Supports DHT, PEX, encryption, magnet links, RSS, IP filtering, and remote management.
    category: Downloaders
    class: service
    icon: icons/qbittorrent.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/qbittorrent/qBittorrent
    web_url: https://www.qbittorrent.org/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "8080"
    - name: PORT_6881
      label: BitTorrent peer connections (TCP/UDP)
      type: port
      default: "6881"
    - name: PORT_6881_UDP
      label: BitTorrent peer connections (TCP/UDP)
      type: port
      default: "6881"
    - name: CONFIG_DATA
      label: Configuration directory
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: DOWNLOADS_PATH
      label: Download directory
      type: path
      default: ""
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
    - name: WEBUI_PORT
      label: Web UI port (must match port mapping)
      type: string
      default: "8080"
    - name: TORRENTING_PORT
      label: BitTorrent listening port for peer connections (must match port mapping)
      type: string
      default: "6881"
    - name: WEBUI_PASSWORD
      label: Password of the Web UI's admin user. Set, it turns the login on.
      type: secret
      default: ""
    - name: WEBUI_AUTH
      label: '''true'' or ''false'' to force the Web UI login on or off. Unset: on when WEBUI_PASSWORD is set, else off (no login).'
      type: string
      default: ""
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
      aliases:
        - latest
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        qbittorrent:
          name: qbittorrent
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:8080 proto:tcp'
            - expose: '6881:6881 proto:tcp'
            - expose: '6881:6881 proto:udp'
          oci:
            user: root
            environment:
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
              - WEBUI_PORT: !ENV '${WEBUI_PORT}'
              - TORRENTING_PORT: !ENV '${TORRENTING_PORT}'
              - WEBUI_PASSWORD: !ENV '${WEBUI_PASSWORD}'
              - WEBUI_AUTH: !ENV '${WEBUI_AUTH}'
          volumes:
            - QBITTORRENT_CONFIG_PATH: /config
            - DOWNLOADS_PATH: /downloads
      volumes:
        QBITTORRENT_CONFIG_PATH:
          device: !ENV '${QBITTORRENT_CONFIG_PATH}'
        DOWNLOADS_PATH:
          device: !ENV '${DOWNLOADS_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/qbittorrent:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=qbittorrent
      PUID=1000
      PGID=1000
      TZ=UTC
      WEBUI_PORT=8080
      TORRENTING_PORT=6881
      WEBUI_PASSWORD=<WEBUI_PASSWORD>
      WEBUI_AUTH=
      WEB_PORT=8080
      QBITTORRENT_CONFIG_PATH=/qbittorrent
      DOWNLOADS_PATH=downloads
  login:
    user: admin
    password: ${WEBUI_PASSWORD}
