name: transmission-wireguard
services:
  transmission-wireguard:
    image: ghcr.io/daemonless/transmission-wireguard:latest
    container_name: transmission-wireguard
    restart: unless-stopped
    annotations:
      org.freebsd.jail.vnet: "new"
    environment:
      - WG_PRIVATE_KEY=${WG_PRIVATE_KEY}
      - WG_PEER_PUBLIC_KEY=${WG_PEER_PUBLIC_KEY}
      - WG_ENDPOINT=${WG_ENDPOINT}
      - WG_ADDRESS=${WG_ADDRESS}
      - WG_DNS=${WG_DNS}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - "${CONFIG_DATA}:/config"
      - "${DOWNLOADS_PATH}:/downloads"
      - "${WATCH_PATH}:/watch"
    ports:
      - "${WEB_PORT}:9091"
      - "${PORT_51413}:51413"
      - "${PORT_51413_UDP}:51413/udp"
x-fjord:
  version: "0.1"
  info:
    id: transmission-wireguard
    name: Transmission with WireGuard
    description: Transmission BitTorrent client with built-in WireGuard VPN support.
    category: Downloaders
    class: service
    icon: icons/transmission-wireguard.svg
    web_port: ${WEB_PORT}
    upstream_url: https://github.com/transmission/transmission
    web_url: https://transmissionbt.com/
  variables:
    - name: WEB_PORT
      label: Web UI
      type: port
      default: "9091"
    - name: PORT_51413
      label: Torrent traffic (TCP/UDP)
      type: port
      default: "51413"
    - name: PORT_51413_UDP
      label: Torrent traffic (TCP/UDP)
      type: port
      default: "51413"
    - name: CONFIG_DATA
      label: Configuration directory (settings.json, WireGuard configs)
      type: zfs_dataset
      default: config
      host_permissions:
        uid: 1000
        gid: 1000
        mode: "755"
    - name: DOWNLOADS_PATH
      label: Download directory
      type: path
      default: ""
    - name: WATCH_PATH
      label: Watch directory for torrent files
      type: path
      default: ""
    - name: WG_PRIVATE_KEY
      label: Your WireGuard private key
      type: secret
      default: ""
      generate: false
    - name: WG_PEER_PUBLIC_KEY
      label: VPN server's public key
      type: secret
      default: ""
      generate: false
    - name: WG_ENDPOINT
      label: VPN server address (host:port)
      type: string
      default: vpn.example.com:51820
    - name: WG_ADDRESS
      label: 'Your tunnel IP address (default: 10.5.0.2/32)'
      type: string
      default: 10.5.0.2/32
    - name: WG_DNS
      label: 'DNS server to use (default: 1.1.1.1)'
      type: string
      default: 1.1.1.1
    - name: PUID
      label: User ID for the application process
      type: string
      default: "1000"
    - name: PGID
      label: Group ID for the application process
      type: string
      default: "1000"
    - name: TZ
      label: Timezone for the container
      type: string
      default: UTC
  variants:
    - id: pkg
      label: FreeBSD quarterly packages
      default: true
      aliases:
        - latest
    - id: pkg-latest
      label: FreeBSD latest packages
  appjail:
    director: |
      # appjail-director.yml

      options:
        - virtualnet: ':<random> default'
        - nat:
      services:
        transmission-wireguard:
          name: transmission_wireguard
          options:
            - container: 'args:--pull'
            - expose: !ENV '${WEB_PORT}:9091 proto:tcp'
            - expose: '51413:51413 proto:tcp'
            - expose: '51413:51413 proto:udp'
          oci:
            user: root
            environment:
              - WG_PRIVATE_KEY: !ENV '${WG_PRIVATE_KEY}'
              - WG_PEER_PUBLIC_KEY: !ENV '${WG_PEER_PUBLIC_KEY}'
              - WG_ENDPOINT: !ENV '${WG_ENDPOINT}'
              - WG_ADDRESS: !ENV '${WG_ADDRESS}'
              - WG_DNS: !ENV '${WG_DNS}'
              - PUID: !ENV '${PUID}'
              - PGID: !ENV '${PGID}'
              - TZ: !ENV '${TZ}'
          volumes:
            - TRANSMISSION_WIREGUARD_CONFIG_PATH: /config
            - DOWNLOADS_PATH: /downloads
            - TRANSMISSION_WIREGUARD_WATCH_PATH: /watch
      volumes:
        TRANSMISSION_WIREGUARD_CONFIG_PATH:
          device: !ENV '${TRANSMISSION_WIREGUARD_CONFIG_PATH}'
        DOWNLOADS_PATH:
          device: !ENV '${DOWNLOADS_PATH}'
        TRANSMISSION_WIREGUARD_WATCH_PATH:
          device: !ENV '${TRANSMISSION_WIREGUARD_WATCH_PATH}'
    makejail: |
      # Makejail

      ARG tag=latest

      OPTION container=boot
      OPTION overwrite=force
      OPTION from=ghcr.io/daemonless/transmission-wireguard:${tag}
    template_conf: |
      # template.conf

      exec.start: "/bin/sh /etc/rc"
      exec.stop: "/bin/sh /etc/rc.shutdown jail"
      mount.devfs
      persist
    env_defaults: |
      # .env

      DIRECTOR_PROJECT=transmission-wireguard
      WG_PRIVATE_KEY=your-private-key
      WG_PEER_PUBLIC_KEY=vpn-server-public-key
      WG_ENDPOINT=vpn.example.com:51820
      WG_ADDRESS=10.5.0.2/32
      WG_DNS=1.1.1.1
      PUID=1000
      PGID=1000
      TZ=UTC
      WEB_PORT=9091
      TRANSMISSION_WIREGUARD_CONFIG_PATH=/transmission-wireguard
      DOWNLOADS_PATH=downloads
      TRANSMISSION_WIREGUARD_WATCH_PATH=/transmission-wireguard/watch
