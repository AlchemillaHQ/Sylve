name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug] "
labels: ["Bug"]
assignees: ["hayzamjs"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Sylve. Please remove passwords, tokens, private keys, and other sensitive information before submitting.

  - type: dropdown
    id: component
    attributes:
      label: Affected area
      description: Which part of Sylve is affected?
      options:
        - Installation and upgrade
        - Dashboard and general UI
        - Virtual machines
        - Jails
        - Storage and ZFS
        - Networking, firewall, and WireGuard
        - Backups, replication, and clustering
        - Authentication and certificates
        - Downloader and utilities
        - CLI and interactive console
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: sylve-version
    attributes:
      label: Sylve version
      description: Provide a release tag or commit SHA.
      placeholder: v0.3.0
    validations:
      required: true

  - type: input
    id: freebsd-version
    attributes:
      label: FreeBSD version
      placeholder: 15.0-RELEASE
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - amd64
        - arm64
        - Other
    validations:
      required: true

  - type: dropdown
    id: installation-method
    attributes:
      label: Installation method
      options:
        - FreeBSD package
        - FreeBSD Ports Collection
        - GitHub release binary
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure...
        2. Open...
        3. Select...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant output after removing sensitive information.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, configuration details, or anything else that may help.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched open and closed issues for an existing report.
          required: true
        - label: I removed passwords, tokens, private keys, and other sensitive information.
          required: true
