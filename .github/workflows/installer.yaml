name: Installer CI

on:
  push:
    branches:
      - master
    paths:
      - "Makefile"
      - "installer/**"
      - ".github/workflows/installer.yaml"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "Makefile"
      - "installer/**"
      - ".github/workflows/installer.yaml"

permissions:
  actions: read
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Installer Daemon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: installer/backend/go.mod
          cache-dependency-path: installer/backend/go.sum

      - name: Build, vet and test
        run: |
          (cd installer/backend && go build ./...)
          make installer-vet installer-test

      - name: Cross-build the daemon (freebsd/amd64)
        run: make installer-backend

  ui:
    name: Installer UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: installer/ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: installer/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Check and build
        run: |
          npm run check
          npm run build

