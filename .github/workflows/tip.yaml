name: Tip

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: tip-release-master
  # Let an in-flight publisher finish replacing assets and metadata.
  cancel-in-progress: false

jobs:
  prepare-release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.vars.outputs.head_sha }}
      should_publish: ${{ steps.vars.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Decide if this run should publish
        id: vars
        run: |
          set -euo pipefail

          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          MASTER_SHA="$(git ls-remote --heads origin master | awk '{print $1}')"

          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

          if [ "${HEAD_SHA}" != "${MASTER_SHA}" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale run for ${HEAD_SHA}; master is ${MASTER_SHA}."
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  # Tip publishes the builds from the CI run that triggered it.
  publish-release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.head_sha }}
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download binary builds
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          merge-multiple: true
          path: tip-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: internal/assets/web-files
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download demo web assets
        uses: actions/download-artifact@v8
        with:
          name: web-demo-assets
          path: web/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Package web assets
        run: |
          set -euo pipefail
          tar -czf tip-assets/sylve-web-assets.tar.gz -C internal/assets web-files
          tar -czf tip-assets/sylve-web-demo-assets.tar.gz -C web/build .

      - name: Download source-built helper bundle
        uses: actions/download-artifact@v8
        with:
          name: csmwrap-assets
          path: .cache/csmwrap
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify and stage helper release assets
        run: |
          set -euo pipefail
          ./scripts/build-csmwrap.sh --verify
          cp .cache/csmwrap/CSMWrap.iso .cache/csmwrap/CSMWrap.iso.gz \
            .cache/csmwrap/CSMWrap-build-manifest.json tip-assets/

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: installer-release-assets-*
          merge-multiple: true
          path: installer-assets
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify installers
        run: |
          set -euo pipefail
          cd installer-assets
          test -s FreeBSD+Sylve-15-STABLE-Installer-amd64.iso
          sha256sum -c FreeBSD+Sylve-15-STABLE-Installer-amd64.iso.sha256
          # 16-CURRENT is best-effort; CI succeeds without it.
          image=FreeBSD+Sylve-16-CURRENT-Installer-amd64.iso
          if [ -s "$image" ] && sha256sum -c "$image.sha256"; then
            echo '16-CURRENT installer: built and verified.' >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "$image" "$image.sha256"
            echo '::warning::16-CURRENT installer unavailable; publishing tip with the required 15-STABLE installer.'
            echo '16-CURRENT installer: unavailable for this tip build. 15-STABLE is included.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish tip assets and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.head_sha }}
        run: |
          set -euo pipefail

          MASTER_SHA="$(git ls-remote --heads origin master | awk '{print $1}')"
          if [ "${SOURCE_SHA}" != "${MASTER_SHA}" ]; then
            echo "Skipping stale build for ${SOURCE_SHA}; master is ${MASTER_SHA}."
            exit 0
          fi

          # Check both builds before changing the existing release.
          go run ./cmd/tipmetadata generate -dir tip-assets -commit "${SOURCE_SHA}"

          if ! gh release view tip >/dev/null 2>&1; then
            gh release create tip --title "tip" --target "${SOURCE_SHA}" \
              --prerelease --notes "Rolling prerelease for Sylve tip."
          fi

          # Save counts before any assets are replaced; asset IDs make retries safe.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/tip" > tip-release.json
          go run ./cmd/tipmetadata downloads -release tip-release.json -out tip-notes.md
          if [ ! -s installer-assets/FreeBSD+Sylve-16-CURRENT-Installer-amd64.iso ]; then
            printf '\n16-CURRENT installer unavailable for this tip build; the 15-STABLE installer is included.\n' >> tip-notes.md
          fi
          gh release edit tip --notes-file tip-notes.md

          ASSET_NAMES="$(jq -r '.assets[].name' tip-release.json)"
          printf '%s\n' "${ASSET_NAMES}" | while IFS= read -r NAME; do
            case "$NAME" in
              SHA256SUMS|*.sha256|sylve-version.json|freebsd-*-sylve-installer-*) gh release delete-asset tip "$NAME" --yes ;;
              FreeBSD+Sylve-16-CURRENT-Installer-amd64.iso)
                if [ ! -s "installer-assets/$NAME" ]; then gh release delete-asset tip "$NAME" --yes; fi
                ;;
            esac
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa tip -m "Latest Continuous Release" "${SOURCE_SHA}"
          git push --force origin tip

          gh release upload tip --clobber \
            tip-assets/sylve-amd64 tip-assets/sylve-arm64 \
            tip-assets/sylve-web-assets.tar.gz tip-assets/sylve-web-demo-assets.tar.gz \
            tip-assets/CSMWrap.iso tip-assets/CSMWrap.iso.gz \
            tip-assets/CSMWrap-build-manifest.json \
            installer-assets/*.iso

          # Hash the actual published assets, not just the local build outputs.
          gh release download tip --dir published-assets --pattern 'sylve-*' --pattern 'CSMWrap*'
          cp tip-assets/build-amd64.json tip-assets/build-arm64.json published-assets/
          go run ./cmd/tipmetadata generate -dir published-assets -commit "${SOURCE_SHA}"

          TIP_SHA="$(git ls-remote origin 'refs/tags/tip^{}' | awk '{print $1}')"
          if [ "${TIP_SHA}" != "${SOURCE_SHA}" ]; then
            echo "::error::tip moved during publication; refusing to upload metadata."
            exit 1
          fi

          gh release upload tip published-assets/sylve-version.json
