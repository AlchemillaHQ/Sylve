name: Tip

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - master
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: tip-release-master
  # Let an in-flight publisher finish replacing assets and metadata.
  cancel-in-progress: false

jobs:
  select-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux_runner: ${{ steps.pick.outputs.linux_runner }}
    steps:
      - name: Pick self-hosted runner when available
        id: pick
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RUNNER_DISCOVERY_TOKEN || github.token }}
          script: |
            const selfHosted = ["self-hosted", "linux", "x64"];
            let selected = ["ubuntu-latest"];

            try {
              const { owner, repo } = context.repo;
              const runners = await github.paginate(
                github.rest.actions.listSelfHostedRunnersForRepo,
                { owner, repo, per_page: 100 },
              );

              const available = runners.some((runner) => {
                if (runner.status !== "online" || runner.busy) {
                  return false;
                }
                const labels = runner.labels.map((label) => label.name);
                return selfHosted.every((required) => labels.includes(required));
              });

              if (available) {
                selected = selfHosted;
              }
            } catch (error) {
              const message = `${error?.message || ""}`;
              const accessDenied =
                error?.status === 403 ||
                /resource not accessible by integration/i.test(message);

              if (accessDenied) {
                core.info(
                  "No permission to list self-hosted runners with current token; falling back to ubuntu-latest.",
                );
              } else {
                core.warning(`Falling back to ubuntu-latest: ${message}`);
              }
            }

            core.info(`Selected runner labels: ${selected.join(", ")}`);
            core.setOutput("linux_runner", JSON.stringify(selected));

  prepare-release:
    needs: select-runner
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.linux_runner) }}
    timeout-minutes: 10
    outputs:
      head_sha: ${{ steps.vars.outputs.head_sha }}
      should_publish: ${{ steps.vars.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Decide if this run should publish
        id: vars
        run: |
          set -euo pipefail

          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          MASTER_SHA="$(git ls-remote --heads origin master | awk '{print $1}')"

          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

          if [ "${HEAD_SHA}" != "${MASTER_SHA}" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale run for ${HEAD_SHA}; master is ${MASTER_SHA}."
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  build-web:
    needs:
      - select-runner
      - prepare-release
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.linux_runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check and Build Web Assets
        run: |
          make frontend

      - name: Build Demo Web Assets
        run: |
          npm run build:demo --prefix web

      - name: Upload Web Assets
        uses: actions/upload-artifact@v7
        with:
          name: tip-web-assets
          path: internal/assets/web-files/
          retention-days: 1

      - name: Package Web Assets
        run: |
          set -euo pipefail
          tar -czf sylve-web-assets.tar.gz -C internal/assets web-files
          tar -czf sylve-web-demo-assets.tar.gz -C web/build .

      - name: Stage web release assets
        uses: actions/upload-artifact@v7
        with:
          name: tip-web-packages
          path: |
            sylve-web-assets.tar.gz
            sylve-web-demo-assets.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-freebsd:
    needs:
      - select-runner
      - prepare-release
      - build-web
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.linux_runner) }}
    timeout-minutes: 30
    env:
      FREEBSD_VERSION: "15"
      ARCH: ${{ matrix.arch }}
      SOURCE_SHA: ${{ needs.prepare-release.outputs.head_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.head_sha }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Install cross-build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils tar file

      - name: Download Web Assets
        uses: actions/download-artifact@v8
        with:
          name: tip-web-assets
          path: internal/assets/web-files

      - name: Resolve FreeBSD release
        id: freebsd
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "version=$(./scripts/resolve-freebsd-release.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache FreeBSD sysroot
        uses: actions/cache@v6
        with:
          path: .cache/freebsd/${{ matrix.arch }}-${{ steps.freebsd.outputs.version }}
          key: freebsd-sysroot-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.freebsd.outputs.version }}-${{ hashFiles('scripts/setup-freebsd-sysroot.sh', 'scripts/resolve-freebsd-release.sh') }}

      - name: Build FreeBSD binary on Linux (${{ matrix.arch }})
        env:
          FREEBSD_VERSION: ${{ steps.freebsd.outputs.version }}
        run: |
          make "cross-build-${ARCH}" GIT_COMMIT="${SOURCE_SHA}"

      - name: Verify binary format
        run: |
          set -euo pipefail
          file bin/sylve | tee /tmp/sylve-file.txt
          grep -q "FreeBSD" /tmp/sylve-file.txt

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            grep -Eq "x86-64|amd64" /tmp/sylve-file.txt
          else
            grep -Eq "aarch64|arm64|ARM aarch64" /tmp/sylve-file.txt
          fi

      - name: Record binary build metadata
        env:
          FREEBSD_RELEASE: ${{ steps.freebsd.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tip-assets
          cp bin/sylve "tip-assets/sylve-${ARCH}"
          go run ./cmd/tipmetadata record \
            -binary "tip-assets/sylve-${ARCH}" -arch "${ARCH}" \
            -freebsd "${FREEBSD_RELEASE}" -commit "${SOURCE_SHA}"

      - name: Stage binary and build metadata
        uses: actions/upload-artifact@v7
        with:
          name: tip-build-${{ matrix.arch }}
          path: tip-assets/
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs:
      - select-runner
      - prepare-release
      - build-web
      - build-freebsd
    if: needs.prepare-release.outputs.should_publish == 'true'
    runs-on: ${{ fromJSON(needs.select-runner.outputs.linux_runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.head_sha }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Download binary builds
        uses: actions/download-artifact@v8
        with:
          pattern: tip-build-*
          merge-multiple: true
          path: tip-assets

      - name: Download web release assets
        uses: actions/download-artifact@v8
        with:
          name: tip-web-packages
          path: tip-assets

      - name: Publish tip assets and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.head_sha }}
        run: |
          set -euo pipefail

          MASTER_SHA="$(git ls-remote --heads origin master | awk '{print $1}')"
          if [ "${SOURCE_SHA}" != "${MASTER_SHA}" ]; then
            echo "Skipping stale build for ${SOURCE_SHA}; master is ${MASTER_SHA}."
            exit 0
          fi

          # Check both builds before changing the existing release.
          go run ./cmd/tipmetadata generate -dir tip-assets -commit "${SOURCE_SHA}"

          if ! gh release view tip >/dev/null 2>&1; then
            gh release create tip --title "tip" --target "${SOURCE_SHA}" \
              --prerelease --notes "Rolling prerelease for Sylve tip."
          fi

          # Save counts before any assets are replaced; asset IDs make retries safe.
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/tip" > tip-release.json
          go run ./cmd/tipmetadata downloads -release tip-release.json -out tip-notes.md
          gh release edit tip --notes-file tip-notes.md

          ASSET_NAMES="$(jq -r '.assets[].name' tip-release.json)"
          for NAME in SHA256SUMS sylve-version.json; do
            if printf '%s\n' "${ASSET_NAMES}" | grep -Fxq "${NAME}"; then
              gh release delete-asset tip "${NAME}" --yes
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa tip -m "Latest Continuous Release" "${SOURCE_SHA}"
          git push --force origin tip

          gh release upload tip --clobber \
            tip-assets/sylve-amd64 tip-assets/sylve-arm64 \
            tip-assets/sylve-web-assets.tar.gz tip-assets/sylve-web-demo-assets.tar.gz

          # Hash the actual published assets, not just the local build outputs.
          gh release download tip --dir published-assets
          cp tip-assets/build-amd64.json tip-assets/build-arm64.json published-assets/
          go run ./cmd/tipmetadata generate -dir published-assets -commit "${SOURCE_SHA}"

          TIP_SHA="$(git ls-remote origin 'refs/tags/tip^{}' | awk '{print $1}')"
          if [ "${TIP_SHA}" != "${SOURCE_SHA}" ]; then
            echo "::error::tip moved during publication; refusing to upload metadata."
            exit 1
          fi

          gh release upload tip published-assets/sylve-version.json
          gh release upload tip published-assets/SHA256SUMS
