name: Deploy Documentation

on:
  push:
    branches:
      - master
    paths:
      - "docs/app-docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-documentation
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs/app-docs
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            docs/app-docs/package-lock.json
            web/package-lock.json

      - name: Install web dependencies
        working-directory: .
        run: npm ci --prefix web

      - name: Generate web project files
        working-directory: .
        run: npm run prepare --prefix web

      - name: Install docs dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/app-docs
          command: deploy
