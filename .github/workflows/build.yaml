name: Build
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
    tags-ignore:
      - tip

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Web Assets
        run: |
          make frontend
      - name: Upload Web Assets
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: internal/assets/web-files/
          retention-days: 1

  build-freebsd:
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FREEBSD_VERSION: "15"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Install cross-build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils tar file

      - name: Download Web Assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: internal/assets/web-files

      - name: Resolve FreeBSD release
        id: freebsd
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "version=$(./scripts/resolve-freebsd-release.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache FreeBSD sysroot
        uses: actions/cache@v6
        with:
          path: .cache/freebsd/${{ matrix.arch }}-${{ steps.freebsd.outputs.version }}
          key: freebsd-sysroot-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.freebsd.outputs.version }}-${{ hashFiles('scripts/setup-freebsd-sysroot.sh', 'scripts/resolve-freebsd-release.sh') }}

      - name: Build FreeBSD binary on Linux (${{ matrix.arch }})
        env:
          FREEBSD_VERSION: ${{ steps.freebsd.outputs.version }}
        run: |
          make cross-build-${{ matrix.arch }}

      - name: Verify binary format
        run: |
          set -euo pipefail
          file bin/sylve | tee /tmp/sylve-file.txt
          grep -q "FreeBSD" /tmp/sylve-file.txt

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            grep -Eq "x86-64|amd64" /tmp/sylve-file.txt
          else
            grep -Eq "aarch64|arm64|ARM aarch64" /tmp/sylve-file.txt
          fi

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: sylve-${{ matrix.arch }}
          path: bin/sylve
          retention-days: 7
