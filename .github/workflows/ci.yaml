name: CI

on:
  push:
    branches:
      - master
    tags-ignore:
      - tip
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "**"
      - "!docs/**"
      - "docs/changelogs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Backend Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      test: ${{ steps.tests.outputs.required }}
    steps:
      - uses: actions/checkout@v7

      - name: Check backend and test inputs
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            backend:
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - '**/*.go'
              - 'go.*'
              - 'Makefile'
              - 'scripts/**'
              - '.gitmodules'
              - 'third-party/csmwrap/**'
              - 'config.example.json'
              - '.github/actions/**'
              - '.github/workflows/ci.yaml'

      - name: Determine whether Test is required
        id: tests
        uses: actions/github-script@v9
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        with:
          script: |
            if (process.env.BACKEND_CHANGED === "true") {
              core.info("Backend or test inputs changed; running Test.");
              core.setOutput("required", true);
              return;
            }

            const { owner, repo } = context.repo;
            const headRepository = context.payload.pull_request?.head.repo?.full_name || `${owner}/${repo}`;
            const response = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: "ci.yaml", branch: process.env.BRANCH,
              event: context.eventName, per_page: 100,
            });
            for (const run of response.data.workflow_runs) {
              if (run.id >= context.runId || run.head_repository?.full_name !== headRepository) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, filter: "latest", per_page: 100,
              });
              const testJobs = jobs.filter((job) => job.name === "Test" || job.name.startsWith("Test ("));
              if (testJobs.length && testJobs.every((job) => job.conclusion === "skipped") && run.conclusion === "success") continue;
              const names = testJobs.some((job) => job.name === "Test")
                ? ["Test"]
                : ["Test (unit)", "Test (integration)", "Test (acceptance)"];
              const results = names.map((name) => testJobs.find((job) => job.name === name)?.conclusion);
              const required = results.some((result) => result !== "success");
              core.info(`Previous Test results: ${results.map((result) => result || "not completed").join(", ")}; running Test: ${required}.`);
              core.setOutput("required", required);
              return;
            }
            core.info("No previous Test result found; running Test.");
            core.setOutput("required", true);

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Validate release changelogs
        run: ./scripts/validate-release-changelog.sh --all

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run quality checks
        run: make quality

  test:
    name: Test (${{ matrix.lane }})
    needs:
      - changes
      - quality
      - build-csmwrap
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: unit
            target: test
          - lane: integration
            target: test-integration
          - lane: acceptance
            target: test-acceptance-all
    env:
      GOCACHE: ${{ github.workspace }}/.cache/freebsd-go/build
      GOMODCACHE: ${{ github.workspace }}/.cache/freebsd-go/mod
      TEST_LANE: ${{ matrix.lane }}
      TEST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download source-built CSMWrap
        uses: actions/download-artifact@v8
        with:
          name: csmwrap-assets
          path: .cache/csmwrap

      - name: Verify and stage CSMWrap embeds before FreeBSD checks
        run: ./scripts/build-csmwrap.sh --verify --stage

      - name: Cache FreeBSD Go files
        id: freebsd_go_cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/freebsd-go/build
            .cache/freebsd-go/mod
          key: freebsd-15-go-${{ matrix.lane }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            freebsd-15-go-${{ matrix.lane }}-${{ hashFiles('go.mod', 'go.sum') }}-
            freebsd-15-go-${{ hashFiles('go.mod', 'go.sum') }}

      - name: Run FreeBSD test suite
        env:
          GO_CACHE_RESTORED: ${{ steps.freebsd_go_cache.outputs.cache-hit != '' }}
        uses: vmactions/freebsd-vm@83b151f58c6047089f4c80eb5ba2039d158ce093 # v1.5.3
        with:
          release: "15"
          usesh: true
          copyback: true
          cache-after-prepare: true
          envs: CI GOCACHE GOMODCACHE GO_CACHE_RESTORED TEST_LANE TEST_TARGET
          prepare: |
            pkg update
            pkg install -y go git libvirt bhyve-firmware qemu-tools jq
            sed -i '' 's/^#*PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
            sysrc sshd_enable=YES
            mkdir -p /root/.ssh && chmod 700 /root/.ssh
            [ -f /root/.ssh/id_ed25519 ] || ssh-keygen -t ed25519 -N "" -f /root/.ssh/id_ed25519
            touch /root/.ssh/authorized_keys
            local_key="$(cat /root/.ssh/id_ed25519.pub)"
            grep -qxF "$local_key" /root/.ssh/authorized_keys || printf '%s\n' "$local_key" >> /root/.ssh/authorized_keys
            chmod 600 /root/.ssh/authorized_keys
          run: |
            setup_started="$(date +%s)"
            mkdir -p test-results
            set +e
            (
              set -e
              git config --global --add safe.directory "$PWD"
              find "$PWD/third-party/csmwrap/source" -name .git -prune -exec sh -c \
                'git config --global --add safe.directory "${1%/.git}"' sh {} \;
              mkdir -p "$GOCACHE" "$GOMODCACHE"
              go build -buildvcs=false -o /tmp/sylve-testreport ./cmd/testreport

              if [ "$TEST_LANE" != unit ]; then
                for module in zfs pf vmm nlsysevent if_bridge if_epair ctl iscsi nvmft nvmf; do
                  kldstat -q -m "$module" || kldload "$module"
                done
                kldstat -q -m nvmf/tcp || kldload nvmf_tcp

                [ -c /dev/cam/ctl ] && [ -c /dev/iscsi ] && [ -c /dev/nvmf ] || {
                  echo "CTL, iSCSI, and NVMe/TCP kernel devices are required for integration tests"
                  exit 1
                }

                command -v nvmecontrol >/dev/null
                command -v qemu-img >/dev/null
                ctladm nvlist -x | grep -q '<ctlnvmflist>'

                service libvirtd onestart || service libvirtd onerestart
                service sshd onestart 2>/dev/null || service sshd onerestart
                ssh-keyscan -H localhost >> /root/.ssh/known_hosts 2>/dev/null || true
                ssh_ready=false
                for i in $(seq 1 60); do
                  if ssh -n -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=2 root@localhost true 2>/dev/null; then
                    ssh_ready=true
                    break
                  fi
                  sleep 0.5
                done
                [ "$ssh_ready" = true ] || { echo "ssh root@localhost not ready"; exit 1; }

                virsh -c bhyve:///system version
                available_kib="$(df -Pk /tmp | awk 'NR == 2 { print $4 }')"
                [ -n "$available_kib" ] && [ "$available_kib" -ge 9437184 ] || {
                  echo "/tmp needs at least 9 GiB available; found ${available_kib:-unknown} KiB"
                  exit 1
                }
              fi
            )
            setup_rc="$?"
            setup_finished="$(date +%s)"
            setup_seconds="$((setup_finished - setup_started))"
            printf '%s\n' "$setup_rc" > test-results/setup.rc
            if [ "$setup_rc" -ne 0 ]; then
              exit 0
            fi

            if [ "$TEST_LANE" = unit ]; then
              go vet ./... ./internal/assets/csmwrap > test-results/vet.log 2>&1
              vet_rc="$?"
              cat test-results/vet.log
              printf '%s\n' "$vet_rc" > test-results/vet.rc
              if [ "$vet_rc" -ne 0 ]; then
                exit 0
              fi
            fi

            /tmp/sylve-testreport \
              -lane "$TEST_LANE" \
              -out test-results \
              -setup-duration "${setup_seconds}s" \
              -cache-restored="$GO_CACHE_RESTORED" \
              -- make -s GO_TEST_FLAGS=-json "$TEST_TARGET"
            test_rc="$?"
            printf '%s\n' "$test_rc" > "test-results/$TEST_LANE.rc"
            exit 0

      - name: Check FreeBSD host setup
        id: setup_result
        if: always()
        run: |
          if [ ! -f test-results/setup.rc ]; then
            echo "FreeBSD host setup did not produce a result"
            exit 1
          fi
          exit "$(cat test-results/setup.rc)"

      - name: Upload vet report
        if: always() && matrix.lane == 'unit' && steps.setup_result.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: vet-report
          path: |
            test-results/vet.log
            test-results/vet.rc
          if-no-files-found: warn
          retention-days: 7

      - name: Check vet result
        id: vet_result
        if: always() && matrix.lane == 'unit' && steps.setup_result.outcome == 'success'
        run: |
          if [ ! -f test-results/vet.rc ]; then
            echo "Vet result was not produced"
            exit 1
          fi
          exit "$(cat test-results/vet.rc)"

      - name: Publish test summary
        if: always() && steps.setup_result.outcome == 'success' && (matrix.lane != 'unit' || steps.vet_result.outcome == 'success')
        run: |
          if [ -f "test-results/$TEST_LANE-summary.md" ]; then
            cat "test-results/$TEST_LANE-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test report
        if: always() && steps.setup_result.outcome == 'success' && (matrix.lane != 'unit' || steps.vet_result.outcome == 'success')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.lane }}-test-report
          path: |
            test-results/${{ matrix.lane }}.json
            test-results/${{ matrix.lane }}.log
            test-results/${{ matrix.lane }}-summary.md
            test-results/${{ matrix.lane }}.rc
          if-no-files-found: warn
          retention-days: 7

      - name: Check test result
        if: always() && steps.setup_result.outcome == 'success' && (matrix.lane != 'unit' || steps.vet_result.outcome == 'success')
        run: |
          if [ ! -f "test-results/$TEST_LANE.rc" ]; then
            echo "$TEST_LANE test result was not produced"
            exit 1
          fi
          exit "$(cat "test-results/$TEST_LANE.rc")"

  build-csmwrap:
    name: Build CSMWrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/csmwrap
        with:
          artifact-name: csmwrap-assets

  build-web:
    name: Build Web
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check and Build Web Assets
        run: make frontend

      - name: Build Demo Web Assets
        run: npm run build:demo --prefix web

      - name: Upload Web Assets
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: internal/assets/web-files/
          retention-days: 1

  build-freebsd:
    name: Build FreeBSD (${{ matrix.arch }})
    needs: [build-web, build-csmwrap]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FREEBSD_VERSION: "15"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Install cross-build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils tar file

      - name: Download Web Assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: internal/assets/web-files

      - name: Resolve FreeBSD release
        id: freebsd
        env:
          ARCH: ${{ matrix.arch }}
        run: echo "version=$(./scripts/resolve-freebsd-release.sh)" >> "$GITHUB_OUTPUT"

      - name: Download source-built CSMWrap
        if: matrix.arch == 'amd64'
        uses: actions/download-artifact@v8
        with:
          name: csmwrap-assets
          path: .cache/csmwrap

      - name: Verify and stage CSMWrap embeds
        if: matrix.arch == 'amd64'
        run: ./scripts/build-csmwrap.sh --verify --stage

      - name: Cache FreeBSD sysroot
        uses: actions/cache@v6
        with:
          path: .cache/freebsd/${{ matrix.arch }}-${{ steps.freebsd.outputs.version }}
          key: freebsd-sysroot-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.freebsd.outputs.version }}-${{ hashFiles('scripts/setup-freebsd-sysroot.sh', 'scripts/resolve-freebsd-release.sh') }}

      - name: Build FreeBSD binary on Linux (${{ matrix.arch }})
        env:
          FREEBSD_VERSION: ${{ steps.freebsd.outputs.version }}
        run: make cross-build-${{ matrix.arch }}

      - name: Verify binary format
        run: |
          set -euo pipefail
          file bin/sylve | tee /tmp/sylve-file.txt
          grep -q "FreeBSD" /tmp/sylve-file.txt

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            grep -Eq "x86-64|amd64" /tmp/sylve-file.txt
          else
            grep -Eq "aarch64|arm64|ARM aarch64" /tmp/sylve-file.txt
          fi

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: sylve-${{ matrix.arch }}
          path: bin/sylve
          retention-days: 7

  ci-success:
    name: CI Success
    if: always()
    needs:
      - changes
      - quality
      - test
      - build-web
      - build-csmwrap
      - build-freebsd
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_REQUIRED: ${{ needs.changes.outputs.test }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_WEB_RESULT: ${{ needs.build-web.result }}
          BUILD_CSMWRAP_RESULT: ${{ needs.build-csmwrap.result }}
          BUILD_FREEBSD_RESULT: ${{ needs.build-freebsd.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$QUALITY_RESULT" = success
          if [ "$TEST_REQUIRED" = true ]; then
            test "$TEST_RESULT" = success
          else
            test "$TEST_REQUIRED" = false
            test "$TEST_RESULT" = skipped
          fi
          test "$BUILD_WEB_RESULT" = success
          test "$BUILD_CSMWRAP_RESULT" = success
          test "$BUILD_FREEBSD_RESULT" = success
