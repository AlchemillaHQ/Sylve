name: CI Retry
run-name: ${{ github.event.workflow_run.display_title }}

# Some GitHub runner hosts don't expose nested virtualization, which bhyve needs.
# Every re-run lands on a fresh runner, so retry those failures up to five times.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Retry runners without nested virtualization
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt <= 5
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed | grep -q 'nested virtualization unavailable'; then
            gh run rerun "$RUN_ID" --repo "$GITHUB_REPOSITORY" --failed
          else
            echo "CI failed for another reason; not retrying."
          fi
