name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-ci:
    if: github.ref_name != 'tip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      target_sha: ${{ steps.vars.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve tagged commit
        id: vars
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-list -n 1 "refs/tags/${GITHUB_REF_NAME}")"
          test -n "$TARGET_SHA"
          echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate release changelog
        env:
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
        run: ./scripts/validate-release-changelog.sh "$TAG_NAME"

      - name: Require successful CI for tagged master commit
        uses: actions/github-script@v9
        env:
          TARGET_SHA: ${{ steps.vars.outputs.target_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const targetSha = process.env.TARGET_SHA;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yaml",
              branch: "master",
              event: "push",
              status: "completed",
              head_sha: targetSha,
              per_page: 100,
            });

            const matches = response.data.workflow_runs.filter((run) =>
              run.name === "CI" &&
              run.head_sha === targetSha &&
              run.head_branch === "master" &&
              run.event === "push" &&
              run.status === "completed" &&
              run.conclusion === "success"
            );

            if (matches.length !== 1) {
              core.setFailed(
                `Expected exactly one successful master CI run for ${targetSha}; found ${matches.length}.`,
              );
              return;
            }

            core.info(`Trusted CI run: ${matches[0].html_url}`);

  select-runner:
    if: github.ref_name != 'tip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      linux_runner: ${{ steps.pick.outputs.linux_runner }}
    steps:
      - name: Pick self-hosted runner when available
        id: pick
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.RUNNER_DISCOVERY_TOKEN || github.token }}
          script: |
            const selfHosted = ["self-hosted", "linux", "x64"];
            let selected = ["ubuntu-latest"];

            try {
              const { owner, repo } = context.repo;
              const runners = await github.paginate(
                github.rest.actions.listSelfHostedRunnersForRepo,
                { owner, repo, per_page: 100 },
              );

              const available = runners.some((runner) => {
                if (runner.status !== "online" || runner.busy) {
                  return false;
                }
                const labels = runner.labels.map((label) => label.name);
                return selfHosted.every((required) => labels.includes(required));
              });

              if (available) {
                selected = selfHosted;
              }
            } catch (error) {
              const message = `${error?.message || ""}`;
              const accessDenied =
                error?.status === 403 ||
                /resource not accessible by integration/i.test(message);

              if (accessDenied) {
                core.info(
                  "No permission to list self-hosted runners with current token; falling back to ubuntu-latest.",
                );
              } else {
                core.warning(`Falling back to ubuntu-latest: ${message}`);
              }
            }

            core.info(`Selected runner labels: ${selected.join(", ")}`);
            core.setOutput("linux_runner", JSON.stringify(selected));

  prepare-release:
    needs:
      - verify-ci
      - select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.linux_runner) }}
    timeout-minutes: 10
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      target_sha: ${{ steps.vars.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-ci.outputs.tag_name }}

      - name: Capture release metadata
        id: vars
        env:
          TAG_NAME: ${{ needs.verify-ci.outputs.tag_name }}
          TARGET_SHA: ${{ needs.verify-ci.outputs.target_sha }}
        run: |
          set -euo pipefail
          CHANGELOG_PATH="$(./scripts/validate-release-changelog.sh "$TAG_NAME")"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "changelog_path=${CHANGELOG_PATH}" >> "$GITHUB_OUTPUT"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
          TARGET_SHA: ${{ steps.vars.outputs.target_sha }}
          CHANGELOG_PATH: ${{ steps.vars.outputs.changelog_path }}
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft')"
            if [ "${IS_DRAFT}" != "true" ]; then
              echo "::error::Release ${TAG_NAME} is already published; refusing to change its notes or assets."
              exit 1
            fi

            gh release edit "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --verify-tag \
              --notes-file "${CHANGELOG_PATH}"
            echo "Updated draft release ${TAG_NAME} from ${CHANGELOG_PATH}"
            exit 0
          fi

          gh release create "${TAG_NAME}" \
            --title "${TAG_NAME}" \
            --target "${TARGET_SHA}" \
            --verify-tag \
            --draft \
            --notes-file "${CHANGELOG_PATH}"

  build-web:
    needs:
      - select-runner
      - prepare-release
    runs-on: ${{ fromJSON(needs.select-runner.outputs.linux_runner) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check and Build Web Assets
        run: |
          make frontend

      - name: Build Demo Web Assets
        run: |
          npm run build:demo --prefix web

      - name: Upload Web Assets
        uses: actions/upload-artifact@v7
        with:
          name: release-web-assets
          path: internal/assets/web-files/
          retention-days: 1

      - name: Package Web Assets
        run: |
          set -euo pipefail
          tar -czf sylve-web-assets.tar.gz -C internal/assets web-files
          tar -czf sylve-web-demo-assets.tar.gz -C web/build .

      - name: Upload web assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail

          IS_DRAFT="$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft')"
          if [ "${IS_DRAFT}" != "true" ]; then
            echo "::error::Release ${TAG_NAME} is already published; refusing to replace its assets."
            exit 1
          fi

          for ASSET_NAME in sylve-web-assets.tar.gz sylve-web-demo-assets.tar.gz; do
            gh release upload "${TAG_NAME}" "${ASSET_NAME}" --clobber
          done

  build-freebsd:
    needs:
      - select-runner
      - prepare-release
      - build-web
    runs-on: ${{ fromJSON(needs.select-runner.outputs.linux_runner) }}
    timeout-minutes: 30
    env:
      FREEBSD_VERSION: "15"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"

      - name: Install cross-build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils tar file

      - name: Download Web Assets
        uses: actions/download-artifact@v8
        with:
          name: release-web-assets
          path: internal/assets/web-files

      - name: Resolve FreeBSD release
        id: freebsd
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "version=$(./scripts/resolve-freebsd-release.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache FreeBSD sysroot
        uses: actions/cache@v6
        with:
          path: .cache/freebsd/${{ matrix.arch }}-${{ steps.freebsd.outputs.version }}
          key: freebsd-sysroot-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.freebsd.outputs.version }}-${{ hashFiles('scripts/setup-freebsd-sysroot.sh', 'scripts/resolve-freebsd-release.sh') }}

      - name: Build FreeBSD binary on Linux (${{ matrix.arch }})
        env:
          FREEBSD_VERSION: ${{ steps.freebsd.outputs.version }}
        run: |
          make cross-build-${{ matrix.arch }}

      - name: Verify binary format
        run: |
          set -euo pipefail
          file bin/sylve | tee /tmp/sylve-file.txt
          grep -q "FreeBSD" /tmp/sylve-file.txt

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            grep -Eq "x86-64|amd64" /tmp/sylve-file.txt
          else
            grep -Eq "aarch64|arm64|ARM aarch64" /tmp/sylve-file.txt
          fi

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          set -euo pipefail

          IS_DRAFT="$(gh release view "${TAG_NAME}" --json isDraft --jq '.isDraft')"
          if [ "${IS_DRAFT}" != "true" ]; then
            echo "::error::Release ${TAG_NAME} is already published; refusing to replace its assets."
            exit 1
          fi

          ASSET_NAME="sylve-${{ matrix.arch }}"
          cp bin/sylve "${ASSET_NAME}"
          gh release upload "${TAG_NAME}" "${ASSET_NAME}" --clobber
