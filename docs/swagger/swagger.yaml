            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
      security:
      - BearerAuth: []
      summary: Delete group
      tags:
      - Groups
  /auth/groups/{groupId}/members:
    put:
      consumes:
      - application/json
      description: Replace all editable members of a managed group; an empty list
        removes all supplementary members
      parameters:
      - description: Positive Group ID
        in: path
        name: groupId
        required: true
        type: integer
      - description: Complete group membership
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_auth.ReplaceGroupMembersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Group Members Replaced
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-internal_handlers_auth_GroupMutationResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
        "413":
          description: Request Entity Too Large
