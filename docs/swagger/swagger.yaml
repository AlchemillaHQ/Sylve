    in: header
    name: Authorization
    type: apiKey
  ClusterKeyAuth:
    description: Exact enabled cluster join key.
    in: header
    name: X-Cluster-Key
    type: apiKey
  ClusterTokenAuth:
    description: Short-lived server-issued cluster token.
    in: header
    name: X-Cluster-Token
    type: apiKey
