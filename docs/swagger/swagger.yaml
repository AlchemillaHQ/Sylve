            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_alchemillahq_sylve_internal.APIResponse-any'
      security:
      - BearerAuth: []
      summary: Replace group members
      tags:
      - Groups
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate an administrator and create a local session
      parameters:
      - description: Login request body
        in: body
        name: request
