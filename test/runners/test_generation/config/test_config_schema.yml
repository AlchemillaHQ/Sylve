
type: object
additionalProperties: false

required:
  - shellspec_name
  - output_dir
  - example_list
properties:
  shell_code:
    type: string
    description: Muli-line entry interpreted as shell code include at top of generated tests
  multi_desc:
    type: string
    description: Description for the Describe block that wraps examples when more than one is generated
  multi_tag:
    type: string
    description: shellspec tag to add to the generated Describe block that wraps examples when more than one is generated
  shellspec_name:
    type: string
    description: Name for the generated ShellSpec file
  output_dir:
    type: string
    description: Directory for generated test files
  example_list:
    type: array
    items:
      $ref: "#/definitions/example_definition"

definitions:
  example_definition:
    additionalProperties: false
    type: object
    required:
      - describe_desc
      - test_list
    properties:
      describe_desc:
        type: string
        description: Description for the Describe block
      tag:
        type: string
        description: shellspec tag to add to the generated Describe block
      shell_code:
        type: string
        description: Muli-line entry interpreted as shell code include at top of Describe block
      hooks_list:
        type: array
        items:
          $ref: "#/definitions/hook_definition"
      skip_if_list:
        $ref: "#/definitions/skip_if_list"
      test_list:
        type: array
        items:
          $ref: "#/definitions/test_definition"

  hook_definition:
    additionalProperties: false
    type: object
    required:
      - name
      - invocation
      - command
    properties:
      name:
          type: string
          description: shellspec hook name
          enum:
            - BeforeAll
            - AfterAll
            - BeforeEach
            - AfterEach
            - BeforeCall
            - AfterCall
            - BeforeRun
            - AfterRun
      invocation:
        type: string
        description: shellspec hook invocation type
        enum:
          - sourced_script      # `.` the file into the current shell; can mutate caller env
          - executed_script     # run the script in a subshell/child process; isolated
          - evaluated_command   # eval an inline command or previously-defined function
      command:
          type: string
          description: shellspec hook command

  test_definition:
    additionalProperties: false
    type: object
    required:
      - test_name
      - it_desc
      - when_command
    properties:
      test_name:
        type: string
      it_desc:
        type: string
      tag:
        type: string
        description: shellspec tag to add to the generated It block
      when_command:
        type: string
      remove_timestamps:
        type : boolean
        description: If true, remove timestamps from output
        default : true
      output_clause:
        type: string
      allow_no_output:
        type: boolean
        description: If true, skip validation that command produces output
        default: false
      setup_scripts:
        $ref: "#/definitions/setup_scripts"

  skip_if_list:
    additionalProperties: false
    type: array
    description: Condition to skip test generation
    items:
      type: object
      required:
        - condition
      properties:
        condition:
          type: string

  setup_scripts:
    additionalProperties: false
    type: array
    description: Scripts to source/run before executing when_command to set up environment
    items:
      type: string
      description: Path to script file (relative to test directory or absolute)