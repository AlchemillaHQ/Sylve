zfs_load="YES"
geom_uzip_load="YES"
kern.geom.label.disk_ident.enable="0"
vfs.root.mountfrom.options="ro"

autoboot_delay="15"
loader_brand="sylve"
loader_brand_x="1"
loader_logo="none"
loader_color="NO"
loader_menu_frame="none"
loader_menu_multi_user_prompt="Installer"
loader_menu_timeout_x="22"
boot_mute="YES"
init_rc="/etc/sylve-live-rc"
splash="/boot/images/sylve-splash.png"

# Match the kiosk size on BIOS VBE and UEFI GOP consoles.
vbe_max_resolution="1024x768"
efi_max_resolution="1024x768"

# Bound the live ARC on small machines.
vfs.zfs.arc_max="512M"
