# vt(4) framebuffer, including UEFI efifb.

Section "ServerLayout"
	Identifier "Layout0"
	Screen "Screen0"
	InputDevice "Keyboard0" "CoreKeyboard"
	InputDevice "Mouse0" "CorePointer"
EndSection

Section "InputDevice"
	Identifier "Keyboard0"
	Driver "kbd"
EndSection

Section "InputDevice"
	Identifier "Mouse0"
	Driver "mouse"
	Option "Protocol" "Auto"
	Option "Device" "/dev/sysmouse"
EndSection

Section "Device"
	Identifier "Card0"
	Driver "scfb"
EndSection

Section "Screen"
	Identifier "Screen0"
	Device "Card0"
	DefaultDepth 24
EndSection
