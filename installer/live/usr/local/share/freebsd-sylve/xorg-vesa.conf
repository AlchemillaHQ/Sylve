# BIOS/VESA fallback without DRM.

Section "ServerLayout"
	Identifier "Layout0"
	Screen "Screen0"
	InputDevice "Keyboard0" "CoreKeyboard"
	InputDevice "Mouse0" "CorePointer"
EndSection

Section "InputDevice"
	Identifier "Keyboard0"
	Driver "kbd"
EndSection

Section "InputDevice"
	Identifier "Mouse0"
	Driver "mouse"
	Option "Protocol" "Auto"
	Option "Device" "/dev/sysmouse"
EndSection

Section "Device"
	Identifier "Card0"
	Driver "vesa"
EndSection

Section "Screen"
	Identifier "Screen0"
	Device "Card0"
	DefaultDepth 24
	SubSection "Display"
		Depth 24
		Modes "1024x768" "800x600" "640x480"
		Virtual 1024 768
	EndSubSection
EndSection
