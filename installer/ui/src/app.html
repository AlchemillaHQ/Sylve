<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="icon" type="image/png" sizes="96x96" href="%sveltekit.assets%/favicon-96x96.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		%sveltekit.head%
		<script>
			(() => {
				const stored = localStorage.getItem('theme');
				const dark = stored === 'dark';
				document.documentElement.classList.toggle('dark', dark);
			})();
		</script>
		<script>
			(() => {
				if (!new URLSearchParams(location.search).has('debug')) return;
				const show = (label, text) => {
					let el = document.getElementById('debug-errors');
					if (!el) {
						el = document.createElement('pre');
						el.id = 'debug-errors';
						el.style.cssText =
							'position:fixed;left:0;right:0;bottom:0;z-index:99999;max-height:40vh;overflow:auto;margin:0;padding:6px 8px;background:#7f1d1d;color:#fff;font:11px/1.4 monospace;white-space:pre-wrap;';
						document.body.appendChild(el);
					}
					el.textContent += label + ': ' + text + '\n';
				};
				window.addEventListener('error', (e) => show('error', (e.error && e.error.stack) || e.message));
				window.addEventListener('unhandledrejection', (e) => show('rejection', (e.reason && e.reason.stack) || String(e.reason)));
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
